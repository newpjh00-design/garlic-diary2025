<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마늘 생산비 조사 - 1단계: 기본정보</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @media (max-width: 640px) {
            .survey-container { padding: 1rem; }
            .question-card { padding: 1.5rem; }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-50 min-h-screen">
    <div id="app"></div>

    <script>
        const surveyState = {
            currentStep: 0,
            formData: {},
            phoneNumber: '',
            stage: 1
        };

        // Google Apps Script URL
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxKtkZcrdK5btMU-o4F0ToXGc9ILLGah03dYaX21PbAIZshKfT5QXCJxdA3tpP0t7sDWQ/exec';

        function formatPhone(value) {
            const numbers = value.replace(/[^0-9]/g, '');
            if (numbers.length <= 3) return numbers;
            if (numbers.length <= 7) return numbers.slice(0, 3) + '-' + numbers.slice(3);
            if (numbers.length <= 11) return numbers.slice(0, 3) + '-' + numbers.slice(3, 7) + '-' + numbers.slice(7);
            return numbers.slice(0, 3) + '-' + numbers.slice(3, 7) + '-' + numbers.slice(7, 11);
        }

        function saveData() {
            if (surveyState.phoneNumber) {
                // 기존 데이터 불러오기
                const existingData = localStorage.getItem(`garlic_survey_${surveyState.phoneNumber}`);
                const parsed = existingData ? JSON.parse(existingData) : {};
                
                // 1단계 데이터만 업데이트
                const dataToSave = {
                    ...surveyState.formData,
                    savedAt: new Date().toISOString(),
                    stage: surveyState.stage,
                    phoneNumber: surveyState.phoneNumber
                };
                
                // 기존 데이터와 병합
                Object.assign(parsed, dataToSave);
                
                localStorage.setItem(`garlic_survey_${surveyState.phoneNumber}`, JSON.stringify(parsed));
            }
        }

        function loadData() {
            if (surveyState.phoneNumber) {
                const savedData = localStorage.getItem(`garlic_survey_${surveyState.phoneNumber}`);
                if (savedData) {
                    const parsed = JSON.parse(savedData);
                    surveyState.formData = parsed;
                    return true;
                }
            }
            return false;
        }

        function manualSave() {
            saveData();
            alert('✅ 데이터가 저장되었습니다!');
        }

        function handleAnswer(key, value) {
            surveyState.formData[key] = value;
            saveData();
        }

        function handleCheckbox(key, option, checked) {
            const current = Array.isArray(surveyState.formData[key]) ? surveyState.formData[key] : [];
            
            // '없음' 옵션 배타적 선택 처리
            if (key === 'owned_equipment') {
                if (option === '없음') {
                    if (checked) {
                        // '없음' 선택 시 다른 항목 모두 제거
                        surveyState.formData[key] = ['없음'];
                    } else {
                        surveyState.formData[key] = [];
                    }
                } else {
                    if (checked) {
                        // 다른 항목 선택 시 '없음' 제거
                        const filtered = current.filter(v => v !== '없음');
                        surveyState.formData[key] = [...filtered, option];
                    } else {
                        surveyState.formData[key] = current.filter(v => v !== option);
                    }
                }
            } else {
                // 일반 체크박스 처리
                const updated = checked 
                    ? [...current, option]
                    : current.filter(v => v !== option);
                surveyState.formData[key] = updated;
            }
            
            saveData();
            render();
        }

        function validateQuestion(question) {
            const value = surveyState.formData[question.key];
            
            // 필수 항목 검증
            if (question.required) {
                if (question.type === 'text' || question.type === 'number' || question.type === 'money') {
                    if (!value || value.toString().trim() === '') {
                        return false;
                    }
                } else if (question.type === 'radio') {
                    if (!value) {
                        return false;
                    }
                } else if (question.type === 'checkbox') {
                    if (!Array.isArray(value) || value.length === 0) {
                        return false;
                    }
                } else if (question.type === 'area_by_variety') {
                    const areaData = surveyState.formData.area_by_variety || {};
                    const varieties = surveyState.formData.garlic_varieties || [];
                    
                    // 선택된 품종에 대해 모두 면적이 입력되었는지 확인
                    for (const variety of varieties) {
                        if (!areaData[variety] || areaData[variety] === '0' || areaData[variety] === '') {
                            return false;
                        }
                    }
                }
            }
            
            return true;
        }

        function nextStep() {
            const currentQ = allQuestions[surveyState.currentStep];
            
            // 조건부 질문이 아닌 경우에만 검증
            if (currentQ.type !== 'section_intro' && currentQ.type !== 'completion') {
                if (!currentQ.conditional || currentQ.conditional(surveyState.formData)) {
                    // 필수 항목 검증
                    if (!validateQuestion(currentQ)) {
                        alert('필수 항목입니다. 답변을 입력해주세요.');
                        return;
                    }
                    
                    // 개인정보 동의 특별 처리
                    if (currentQ.key === 'consent' && surveyState.formData.consent === '동의하지 않습니다') {
                        alert('개인정보 수집 및 이용에 동의하셔야 설문에 참여하실 수 있습니다.');
                        return;
                    }
                }
            }
            
            if (surveyState.currentStep < allQuestions.length - 1) {
                surveyState.currentStep++;
                window.scrollTo({ top: 0, behavior: 'smooth' });
                render();
            }
        }

        function handleVarietyArea(variety, value) {
            const current = surveyState.formData.area_by_variety || {};
            current[variety] = value;
            surveyState.formData.area_by_variety = current;
            
            // 총 재배면적 자동 계산
            const total = Object.values(current).reduce((sum, area) => {
                return sum + (parseFloat(area) || 0);
            }, 0);
            surveyState.formData.total_cultivation_area = total;
            
            saveData();
        }

        async function submitStage() {
            saveData();
            
            // Google Sheets에 데이터 제출
            const submitData = {
                timestamp: new Date().toISOString(),
                phoneNumber: surveyState.phoneNumber,
                stage: 1,
                ...surveyState.formData,
                completed_stage_1: true
            };

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(submitData)
                });

                // 로컬 스토리지에 완료 표시 저장
                surveyState.formData.completed_stage_1 = true;
                saveData();

                alert('✅ 1단계가 제출되었습니다!\n\n메인 화면으로 돌아가 다음 단계를 진행하시거나,\n언제든지 다시 접속하여 수정할 수 있습니다.');
                
                // 메인 페이지로 이동
                window.location.href = 'index.html';
            } catch (error) {
                console.error('제출 오류:', error);
                alert('✅ 1단계가 저장되었습니다!\n\n메인 화면으로 돌아가 다음 단계를 진행하세요.\n(네트워크 오류가 있었지만 데이터는 로컬에 저장되었습니다)');
                window.location.href = 'index.html';
            }
        }

        const allQuestions = [
            {
                id: 0,
                type: 'section_intro',
                title: '마늘 생산비 조사',
                subtitle: '1단계: 기본정보',
                question: '농가 기본정보 조사',
                description: '농가 위치, 경력, 재배면적 등을 조사합니다. 약 5분 소요됩니다.'
            },
            {
                id: 1,
                section: '개인정보 동의',
                type: 'radio',
                question: '개인정보 수집 및 이용에 동의하십니까?',
                helper: '성명, 주소, 연락처, 재배면적 등의 정보가 조사 목적으로만 사용되며, 2년 후 파기됩니다.',
                options: ['동의합니다', '동의하지 않습니다'],
                key: 'consent',
                required: true
            },
            {
                id: 2,
                section: '기본정보',
                type: 'text',
                question: '이름을 알려주세요',
                helper: '예: 홍길동',
                key: 'name',
                required: true
            },
            {
                id: 3,
                section: '기본정보',
                type: 'text',
                question: '농가가 위치한 지역 시/군을 알려주세요.',
                helper: '예: 보은군',
                key: 'farmer_city',
                required: true
            },
            {
                id: 4,
                section: '기본정보',
                type: 'text',
                question: '농가가 위치한 읍/면을 알려주세요.',
                helper: '예: 탄부면',
                key: 'farmer_district',
                required: true
            },
            {
                id: 5,
                section: '기본정보',
                type: 'number',
                question: '마늘 농사 경력은 몇 년입니까?',
                helper: '올해를 포함하여 총 몇 년인지 입력해주세요',
                unit: '년',
                key: 'farming_experience',
                required: true
            },
            {
                id: 6,
                section: '기본정보',
                type: 'checkbox',
                question: '재배하는 마늘 품종을 모두 선택해주세요',
                options: ['남도', '대서', '한지', '기타'],
                key: 'garlic_varieties',
                required: true
            },
            {
                id: 7,
                section: '기본정보',
                type: 'area_by_variety',
                question: '품종별로 마늘 재배 면적은 몇 평입니까?',
                helper: '선택하신 품종별로 입력해주세요',
                unit: '평',
                key: 'area_by_variety',
                required: true,
                conditional: (data) => Array.isArray(data.garlic_varieties) && data.garlic_varieties.length > 0
            },
            {
                id: 8,
                section: 'checkbox',
                type: 'field_method',
                question: '재배방식을 모두 선택해주세요.',
                helper: '['노지재배', '시설재배(하우스)', '친환경재배']',
                unit: '평',
                key: 'field_method',
                required: true,
            },
            {
                id: 9,
                section: '기본정보',
                type: 'radio',
                question: '이모작을 하십니까?',
                options: ['네, 합니다', '아니오, 안합니다'],
                key: 'double_crop'
            },
            {
                id: 10,
                section: '기본정보',
                type: 'radio',
                question: '재배 토지는 자가 소유입니까?',
                options: ['자가 소유', '임차', '자가 + 임차 혼합'],
                key: 'land_ownership'
            },
            {
                id: 11,
                section: '기본정보',
                type: 'money',
                question: '올해 토지 임차료는 총 얼마입니까?',
                helper: '임차한 토지 전체의 연간 임차료 총액을 입력해주세요 (평당 평균 5,000~15,000원)',
                key: 'land_rental_cost',
                conditional: (data) => data.land_ownership !== '자가 소유'
            },
            {
                id: 12,
                section: '기본정보',
                type: 'checkbox',
                question: '보유하고 있는 농기계를 모두 선택해주세요',
                options: ['트랙터', '경운기', '파종기', '수확기', '건조기', '저온저장고', '없음'],
                key: 'owned_equipment'
            },
            {
                id: 13,
                section: '기본정보',
                type: 'checkbox',
                question: '주로 어떤 방식으로 판매하십니까?',
                helper: '판매방식을 모두 선택해주세요',
                options: ['산지 유통인/수집상 대상 판매', '농협 공판장/도매시장 경매', '계약 재배 및 출하', '가공업체 대상 판매', '직접 판매(장터/온라인/택배 등)'],
                key: 'sales_method'
            },
            {
                id: 14,
                section: '기본정보',
                type: 'radio',
                question: '연령대를 선택해주세요',
                options: ['40대 이하', '50대', '60대', '70대', '80대 이상'],
                key: 'age_group'
            },
            {
                id: 15,
                type: 'completion',
                title: '1단계 완료!',
                question: '기본정보 입력이 완료되었습니다.'
            }
        ];

        function prevStep() {
            if (surveyState.currentStep > 0) {
                surveyState.currentStep--;
                window.scrollTo({ top: 0, behavior: 'smooth' });
                render();
            }
        }

        function render() {
            const app = document.getElementById('app');
            
            // 전화번호 확인
            const savedPhone = localStorage.getItem('garlic_survey_phone');
            if (!savedPhone) {
                app.innerHTML = `
                    <div class="min-h-screen flex items-center justify-center p-4">
                        <div class="max-w-md w-full bg-white rounded-lg shadow-lg p-8 text-center">
                            <div class="bg-blue-100 rounded-full w-20 h-20 flex items-center justify-center mx-auto mb-4">
                                <span class="text-4xl">⚠️</span>
                            </div>
                            <h2 class="text-2xl font-bold text-gray-800 mb-4">로그인이 필요합니다</h2>
                            <p class="text-gray-600 mb-6">먼저 메인 화면에서 전화번호로 로그인해주세요.</p>
                            <a href="index.html" class="inline-block px-6 py-3 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700">
                                메인 화면으로 이동
                            </a>
                        </div>
                    </div>
                `;
                return;
            }

            // 전화번호 설정 및 데이터 로드
            if (!surveyState.phoneNumber) {
                surveyState.phoneNumber = savedPhone;
                loadData();
            }

            const currentQ = allQuestions[surveyState.currentStep];
            const totalSteps = allQuestions.length;
            const progress = ((surveyState.currentStep + 1) / totalSteps) * 100;

            // 조건부 질문 스킵
            if (currentQ.conditional && !currentQ.conditional(surveyState.formData)) {
                if (surveyState.currentStep < allQuestions.length - 1) {
                    surveyState.currentStep++;
                    render();
                } else if (surveyState.currentStep > 0) {
                    surveyState.currentStep--;
                    render();
                }
                return;
            }

            if (currentQ.type === 'completion') {
                const isAlreadySubmitted = surveyState.formData.completed_stage_1;
                const totalArea = surveyState.formData.total_cultivation_area || 0;
                app.innerHTML = `
                    <div class="min-h-screen flex items-center justify-center p-4">
                        <div class="max-w-2xl w-full bg-white rounded-lg shadow-lg p-8 text-center space-y-6 fade-in">
                            <div class="bg-green-100 rounded-full w-20 h-20 flex items-center justify-center mx-auto">
                                <svg class="w-12 h-12 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                                </svg>
                            </div>
                            <h2 class="text-3xl font-bold text-gray-800">${currentQ.title}</h2>
                            <p class="text-gray-600 text-lg">${currentQ.question}</p>
                            
                            ${isAlreadySubmitted ? `
                                <div class="bg-green-50 border-l-4 border-green-400 p-4 rounded text-left">
                                    <p class="text-sm text-gray-700">
                                        ✅ <strong>이미 제출된 단계입니다</strong><br>
                                        수정 사항이 있다면 "다시 제출하기" 버튼을 눌러주세요.
                                    </p>
                                </div>
                            ` : ''}
                            
                            <div class="bg-blue-50 p-6 rounded-lg text-left">
                                <h3 class="font-bold text-gray-800 mb-3">📋 입력하신 정보</h3>
                                <div class="text-sm space-y-1 text-gray-700">
                                    <p><strong>성함:</strong> ${surveyState.formData.name || '-'}</p>
                                    <p><strong>농가 위치:</strong> ${surveyState.formData.farmer_city || ''} ${surveyState.formData.farmer_district || ''}</p>
                                    <p><strong>재배 경력:</strong> ${surveyState.formData.farming_experience || '-'}년</p>
                                    <p><strong>총 재배 면적:</strong> ${totalArea}평</p>
                                    <p><strong>품종:</strong> ${Array.isArray(surveyState.formData.garlic_varieties) ? surveyState.formData.garlic_varieties.join(', ') : '-'}</p>
                                </div>
                            </div>

                            <div class="bg-yellow-50 border-l-4 border-yellow-400 p-4 rounded text-left">
                                <p class="text-sm text-gray-700">
                                    💡 <strong>다음 단계:</strong> 제출 후 메인 화면으로 이동하여 2단계를 진행하세요.
                                </p>
                            </div>
                            
                            <div class="flex gap-4 justify-center flex-wrap">
                                <button
                                    onclick="prevStep()"
                                    class="px-6 py-3 bg-gray-200 text-gray-700 rounded-lg font-medium hover:bg-gray-300"
                                >
                                    ← 수정하기
                                </button>
                                <button
                                    onclick="submitStage()"
                                    class="px-6 py-3 ${isAlreadySubmitted ? 'bg-green-600 hover:bg-green-700' : 'bg-blue-600 hover:bg-blue-700'} text-white rounded-lg font-medium"
                                >
                                    ${isAlreadySubmitted ? '다시 제출하기' : '제출하기'}
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                return;
            }

            if (currentQ.type === 'section_intro') {
                app.innerHTML = `
                    <div class="min-h-screen flex items-center justify-center p-4">
                        <div class="max-w-2xl w-full bg-white rounded-lg shadow-lg p-8 text-center space-y-6 fade-in">
                            <div class="bg-blue-100 rounded-full w-20 h-20 flex items-center justify-center mx-auto">
                                <span class="text-4xl">📋</span>
                            </div>
                            <h1 class="text-3xl font-bold text-gray-800">${currentQ.title}</h1>
                            <p class="text-xl text-blue-600 font-medium">${currentQ.subtitle}</p>
                            <p class="text-lg text-gray-700">${currentQ.question}</p>
                            <p class="text-gray-600">${currentQ.description}</p>
                            
                            <div class="flex gap-4 justify-center">
                                <a href="index.html" class="px-6 py-3 bg-gray-200 text-gray-700 rounded-lg font-medium hover:bg-gray-300">
                                    ← 메인으로
                                </a>
                                <button
                                    onclick="nextStep()"
                                    class="px-8 py-3 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700 text-lg"
                                >
                                    시작하기 →
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                return;
            }

            let questionHTML = renderQuestionContent(currentQ);

            app.innerHTML = `
                <div class="min-h-screen p-4 survey-container">
                    <div class="max-w-3xl mx-auto">
                        <div class="bg-white rounded-t-lg shadow-lg p-4 md:p-6">
                            <div class="flex justify-between items-center mb-4">
                                <div>
                                    <h1 class="text-lg md:text-2xl font-bold text-gray-800">마늘 생산비 조사</h1>
                                    <p class="text-sm text-blue-600">1단계: 기본정보</p>
                                </div>
                                <div class="flex gap-2">
                                    <a href="index.html" class="px-3 py-2 bg-gray-200 text-gray-700 rounded-lg text-sm hover:bg-gray-300">
                                        메인
                                    </a>
                                    <button
                                        onclick="manualSave()"
                                        class="px-3 py-2 bg-blue-600 text-white rounded-lg text-sm hover:bg-blue-700"
                                    >
                                        💾 저장
                                    </button>
                                </div>
                            </div>
                            
                            <div class="flex items-center justify-between mb-2">
                                <span class="text-xs md:text-sm font-medium text-gray-700">
                                    진행률: ${Math.round(progress)}%
                                </span>
                                <span class="text-xs md:text-sm text-gray-600">
                                    ${surveyState.currentStep + 1} / ${totalSteps}
                                </span>
                            </div>
                            <div class="w-full bg-gray-200 rounded-full h-2">
                                <div class="bg-blue-600 h-2 rounded-full transition-all duration-300" style="width: ${progress}%"></div>
                            </div>
                        </div>

                        <div class="bg-white shadow-lg p-4 md:p-8 space-y-6 question-card fade-in">
                            ${currentQ.section ? `
                                <div class="text-sm text-blue-600 font-medium">
                                    📌 ${currentQ.section}
                                </div>
                            ` : ''}
                            
                            <h2 class="text-xl md:text-2xl font-bold text-gray-800">
                                ${currentQ.question}
                                ${currentQ.required ? '<span class="text-red-500 ml-1">*</span>' : ''}
                            </h2>
                            
                            ${currentQ.helper ? `
                                <div class="bg-yellow-50 border-l-4 border-yellow-400 p-3 rounded">
                                    <p class="text-sm text-gray-700">💡 ${currentQ.helper}</p>
                                </div>
                            ` : ''}

                            ${questionHTML}
                        </div>

                        <div class="bg-white rounded-b-lg shadow-lg p-4 md:p-6 flex justify-between">
                            <button
                                onclick="prevStep()"
                                ${surveyState.currentStep === 0 ? 'disabled' : ''}
                                class="px-4 md:px-6 py-3 rounded-lg font-medium ${
                                    surveyState.currentStep === 0
                                        ? 'bg-gray-200 text-gray-400 cursor-not-allowed'
                                        : 'bg-gray-600 text-white hover:bg-gray-700'
                                }"
                            >
                                ← 이전
                            </button>

                            <button
                                onclick="nextStep()"
                                class="px-4 md:px-6 py-3 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700"
                            >
                                다음 →
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderQuestionContent(question) {
            const value = surveyState.formData[question.key];

            switch (question.type) {
                case 'text':
                    return `
                        <input
                            type="text"
                            value="${value || ''}"
                            onchange="handleAnswer('${question.key}', this.value)"
                            placeholder="${question.helper || '입력해주세요'}"
                            class="w-full p-3 md:p-4 text-base md:text-lg border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none"
                        />
                    `;

                case 'number':
                case 'money':
                    return `
                        <div class="flex items-center space-x-3">
                            <input
                                type="number"
                                value="${value || ''}"
                                onchange="handleAnswer('${question.key}', this.value)"
                                min="0"
                                placeholder="0"
                                class="flex-1 p-3 md:p-4 text-base md:text-lg border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none"
                            />
                            <span class="text-lg md:text-xl font-medium text-gray-600">${question.unit || '원'}</span>
                        </div>
                        ${question.type === 'money' ? `
                            <button
                                onclick="handleAnswer('${question.key}', '0'); render();"
                                class="text-sm text-blue-600 hover:underline"
                            >
                                비용이 안 들었어요 (0원)
                            </button>
                        ` : ''}
                    `;

                case 'radio':
                    return `
                        <div class="space-y-3">
                            ${question.options.map(option => `
                                <label class="flex items-center space-x-3 p-3 md:p-4 border-2 rounded-lg cursor-pointer hover:bg-blue-50 transition-colors ${value === option ? 'border-blue-500 bg-blue-50' : 'border-gray-300'}">
                                    <input
                                        type="radio"
                                        name="${question.key}"
                                        class="w-5 h-5"
                                        ${value === option ? 'checked' : ''}
                                        onchange="handleAnswer('${question.key}', '${option}'); render();"
                                    />
                                    <span class="text-base md:text-lg">${option}</span>
                                </label>
                            `).join('')}
                        </div>
                    `;

                case 'checkbox':
                    const selectedValues = Array.isArray(value) ? value : [];
                    return `
                        <div class="space-y-3">
                            ${question.options.map(option => {
                                const isChecked = selectedValues.includes(option);
                                return `
                                <label class="flex items-center space-x-3 p-3 md:p-4 border-2 rounded-lg cursor-pointer hover:bg-blue-50 transition-colors ${isChecked ? 'border-blue-500 bg-blue-50' : 'border-gray-300'}">
                                    <input
                                        type="checkbox"
                                        class="w-5 h-5"
                                        ${isChecked ? 'checked' : ''}
                                        onchange="handleCheckbox('${question.key}', '${option}', this.checked)"
                                    />
                                    <span class="text-base md:text-lg">${option}</span>
                                </label>
                            `}).join('')}
                        </div>
                    `;

                case 'area_by_variety':
                    // 선택된 품종 가져오기
                    const selectedVarieties = Array.isArray(surveyState.formData.garlic_varieties) 
                        ? surveyState.formData.garlic_varieties 
                        : [];
                    
                    if (selectedVarieties.length === 0) {
                        return '<p class="text-gray-500">먼저 품종을 선택해주세요.</p>';
                    }

                    const areaData = surveyState.formData.area_by_variety || {};
                    const totalArea = Object.values(areaData).reduce((sum, area) => sum + (parseFloat(area) || 0), 0);

                    return `
                        <div class="space-y-4">
                            ${selectedVarieties.map(variety => `
                                <div class="bg-blue-50 p-4 rounded-lg">
                                    <label class="block mb-2">
                                        <span class="text-base md:text-lg font-medium text-gray-800">${variety} 재배면적</span>
                                    </label>
                                    <div class="flex items-center space-x-3">
                                        <input
                                            type="number"
                                            value="${areaData[variety] || ''}"
                                            onchange="handleVarietyArea('${variety}', this.value); render();"
                                            min="0"
                                            placeholder="0"
                                            class="flex-1 p-3 md:p-4 text-base md:text-lg border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none"
                                        />
                                        <span class="text-lg md:text-xl font-medium text-gray-600">평</span>
                                    </div>
                                </div>
                            `).join('')}
                            
                            <div class="bg-green-50 border-2 border-green-500 p-4 rounded-lg">
                                <div class="flex justify-between items-center">
                                    <span class="text-lg font-bold text-gray-800">총 재배면적</span>
                                    <span class="text-2xl font-bold text-green-600">${totalArea} 평</span>
                                </div>
                            </div>
                        </div>
                    `;

                default:
                    return '<p class="text-gray-500">알 수 없는 질문 유형입니다.</p>';
            }
        }

        render();
    </script>
</body>
</html>
