<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마늘 생산비 조사 - 1단계: 기본정보</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-50 min-h-screen">
    <div id="app"><div class="min-h-screen flex items-center justify-center"><p class="text-gray-500 text-lg">데이터 불러오는 중...</p></div></div>

    <script>
        const surveyState = {
            currentStep: 0,
            formData: {},
            phoneNumber: '',
            stage: 1
        };

        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxyddb2aW1WXORKjC0oJsabEPKX1_KgGT_xpg4Op2O2Zm1QiHUWl9XZyjjAuWevwm2w/exec';

        // ── 유틸리티 ──────────────────────────────
        function formatPhone(value) {
            const n = value.replace(/[^0-9]/g, '');
            if (n.length <= 3) return n;
            if (n.length <= 7) return n.slice(0,3)+'-'+n.slice(3);
            return n.slice(0,3)+'-'+n.slice(3,7)+'-'+n.slice(7,11);
        }

        // ★ 천단위 콤마 포맷
        function fmtMoney(v) {
            const n = parseInt(String(v||'').replace(/[^0-9]/g,''))||0;
            return n === 0 ? '' : n.toLocaleString('ko-KR');
        }
        function parseMoney(v) {
            return parseInt(String(v||'').replace(/[^0-9]/g,''))||0;
        }

        // ── 데이터 저장/로드 ──────────────────────
        function saveData() {
            if (!surveyState.phoneNumber) return;
            const key = `garlic_survey_${surveyState.phoneNumber}`;
            const existing = JSON.parse(localStorage.getItem(key)||'{}');
            Object.assign(existing, surveyState.formData, {
                savedAt: new Date().toISOString(),
                stage: surveyState.stage,
                phoneNumber: surveyState.phoneNumber
            });
            localStorage.setItem(key, JSON.stringify(existing));
        }

        function loadData() {
            if (!surveyState.phoneNumber) return false;
            const saved = localStorage.getItem(`garlic_survey_${surveyState.phoneNumber}`);
            if (saved) {
                surveyState.formData = JSON.parse(saved);
                return true;
            }
            return false;
        }

        // ★ 서버에서 데이터 동기화 (기기 간 이어쓰기 핵심)
        async function syncFromServer(phone) {
            try {
                const resp = await fetch(`${SCRIPT_URL}?action=load&phone=${encodeURIComponent(phone)}`);
                if (!resp.ok) throw new Error();
                const result = await resp.json();
                if (result.success && result.data && Object.keys(result.data).length > 0) {
                    const key = `garlic_survey_${phone}`;
                    const local = JSON.parse(localStorage.getItem(key)||'{}');
                    // 서버 데이터로 로컬 병합 (서버 우선)
                    const merged = Object.assign({}, local, result.data);
                    localStorage.setItem(key, JSON.stringify(merged));
                    console.log('✅ 서버 데이터 동기화 완료');
                }
            } catch(e) {
                console.log('ℹ️ 서버 동기화 실패, 로컬 데이터 사용');
            }
        }

        // ── 질문 목록 ─────────────────────────────
        const allQuestions = [
            { id:0, type:'section_intro', title:'마늘 생산비 조사', subtitle:'1단계: 기본정보', question:'농가 기본정보 조사', description:'농가 위치, 경력, 재배면적 등을 조사합니다. 약 5분 소요됩니다.' },
            { id:1, section:'개인정보 동의', type:'radio', question:'개인정보 수집 및 이용에 동의하십니까?', helper:'성명, 주소, 연락처, 재배면적 등의 정보가 조사 목적으로만 사용되며, 2년 후 파기됩니다.', options:['동의합니다','동의하지 않습니다'], key:'consent', required:true },
            { id:2, section:'기본정보', type:'text', question:'이름을 알려주세요', helper:'예: 홍길동', key:'name', required:true },
            { id:3, section:'기본정보', type:'text', question:'농가가 위치한 지역 시/군을 알려주세요.', helper:'예: 보은군', key:'farmer_city', required:true },
            { id:4, section:'기본정보', type:'text', question:'농가가 위치한 읍/면을 알려주세요.', helper:'예: 탄부면', key:'farmer_district', required:true },
            { id:5, section:'기본정보', type:'number', question:'마늘 농사 경력은 몇 년입니까?', helper:'올해를 포함하여 총 몇 년인지 입력해주세요', unit:'년', key:'farming_experience', required:true },
            { id:6, section:'기본정보', type:'checkbox', question:'재배하는 마늘 품종을 모두 선택해주세요', options:['남도종','대서종','한지형','기타'], key:'garlic_varieties', required:true },
            { id:7, section:'기본정보', type:'area_by_variety', question:'품종별로 마늘 재배 면적은 몇 평입니까?', helper:'선택하신 품종별로 입력해주세요', unit:'평', key:'area_by_variety', required:true, conditional:(d)=>Array.isArray(d.garlic_varieties)&&d.garlic_varieties.length>0 },
            { id:8, section:'기본정보', type:'checkbox', question:'재배방식을 모두 선택해주세요.', options:['노지재배','시설재배(하우스)','친환경재배'], key:'field_method', required:true },
            { id:9, section:'기본정보', type:'radio', question:'이모작을 하십니까?', options:['네, 합니다','아니오, 안합니다'], key:'double_crop' },
            { id:10, section:'기본정보', type:'radio', question:'재배 토지는 자가 소유입니까?', options:['자가 소유','임차','자가 + 임차 혼합'], key:'land_ownership' },
            // ★ 자가+임차 면적 분리 입력 (조건부)
            { id:101, section:'기본정보', type:'land_area_split', question:'자가 소유 면적과 임차 면적을 각각 입력해주세요', key:'land_area_split', conditional:(d)=>d.land_ownership==='자가 + 임차 혼합' },
            { id:11, section:'기본정보', type:'money', question:'올해 토지 임차료는 총 얼마입니까?', helper:'임차한 토지 전체의 연간 임차료 총액 (평당 평균 5,000~15,000원)', key:'land_rental_cost', conditional:(d)=>d.land_ownership!=='자가 소유' },
            { id:12, section:'기본정보', type:'checkbox', question:'보유하고 있는 농기계를 모두 선택해주세요', options:['트랙터','경운기','파종기','수확기','건조기','저온저장고','없음'], key:'owned_equipment' },
            // ★ 농기계 구입년도 (조건부)
            { id:121, section:'기본정보', type:'equipment_years', question:'보유 농기계별 구입년도를 입력해주세요', helper:'모르시면 비워두셔도 됩니다', key:'equipment_purchase_years', conditional:(d)=>Array.isArray(d.owned_equipment)&&d.owned_equipment.length>0&&!d.owned_equipment.includes('없음') },
            { id:13, section:'기본정보', type:'checkbox', question:'주로 어떤 방식으로 판매하십니까?', helper:'판매방식을 모두 선택해주세요', options:['산지 유통인/수집상 대상 판매','농협 공판장/도매시장 경매','계약 재배 및 출하','가공업체 대상 판매','직접 판매(장터/온라인/택배 등)'], key:'sales_method' },
            { id:14, section:'기본정보', type:'radio', question:'연령대를 선택해주세요', options:['40대 이하','50대','60대','70대','80대 이상'], key:'age_group' }
        ];

        function getVisibleQuestions() {
            return allQuestions.filter(q => !q.conditional || q.conditional(surveyState.formData));
        }

        function isStepComplete(step) {
            const q = getVisibleQuestions()[step];
            if (!q || !q.required) return true;
            const v = surveyState.formData[q.key];
            if (q.type==='checkbox') return Array.isArray(v)&&v.length>0;
            if (q.type==='area_by_variety') {
                const varieties = surveyState.formData.garlic_varieties||[];
                if (!varieties.length) return false;
                const allEntered = varieties.every(vr=>v&&v[vr]&&v[vr]>0);
                if (varieties.includes('기타')) return allEntered && v&&v['기타_품종명']&&v['기타_품종명'].trim()!=='';
                return allEntered;
            }
            return v!==undefined&&v!==null&&v!=='';
        }

        function canMoveForward() { return isStepComplete(surveyState.currentStep); }

        // ★ 버튼 상태 업데이트 - disabled 속성 대신 CSS 클래스로 처리 (더 안정적)
        function updateButtonState() {
            const btn = document.getElementById('nextBtn') || document.getElementById('submitBtn');
            if (!btn) return;
            const ok = canMoveForward();
            btn.style.opacity = ok ? '1' : '0.4';
            btn.style.cursor = ok ? 'pointer' : 'not-allowed';
            // disabled 속성 완전히 제거하고 nextStep에서 검증
            btn.removeAttribute('disabled');
        }

        function nextStep() {
            if (!canMoveForward()) { alert('필수 항목을 입력해주세요'); return; }
            saveData();
            const vq = getVisibleQuestions();
            if (surveyState.currentStep < vq.length-1) { surveyState.currentStep++; render(); window.scrollTo(0,0); }
        }

        function prevStep() {
            if (surveyState.currentStep > 0) { surveyState.currentStep--; render(); window.scrollTo(0,0); }
        }

        // ★ 제출 중 중복 클릭 방지
        let isSubmitting = false;

        async function submitSurvey() {
            if (isSubmitting) return;
            if (!canMoveForward()) { alert('필수 항목을 입력해주세요'); return; }
            if (!confirm('1단계를 제출하시겠습니까?\n나중에 수정할 수 있습니다.')) return;

            isSubmitting = true;
            const btn = document.getElementById('submitBtn');
            if (btn) { btn.disabled = true; btn.textContent = '저장 중...'; }

            const submitData = {
                phoneNumber: surveyState.phoneNumber,
                stage: 1,
                formData: surveyState.formData,
                completed_stage_1: true,
                timestamp: new Date().toISOString()
            };

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST', mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(submitData)
                });
            } catch(e) { /* no-cors는 항상 성공으로 처리 */ }

            // localStorage 저장 (기존 데이터 병합)
            const key = `garlic_survey_${surveyState.phoneNumber}`;
            const existing = JSON.parse(localStorage.getItem(key)||'{}');
            Object.assign(existing, submitData);
            localStorage.setItem(key, JSON.stringify(existing));

            isSubmitting = false;
            alert('✅ 1단계가 제출되었습니다!');
            window.location.href = 'index.html';
        }

        // ── 질문 렌더링 ───────────────────────────
        function renderQuestion(q) {
            const value = surveyState.formData[q.key];
            switch(q.type) {
                case 'section_intro':
                    return `<div class="text-center py-12">
                        <h1 class="text-4xl font-bold text-gray-800 mb-4">${q.title}</h1>
                        <h2 class="text-2xl font-semibold text-blue-600 mb-6">${q.subtitle}</h2>
                        <p class="text-xl text-gray-700 mb-4">${q.question}</p>
                        <p class="text-gray-600">${q.description}</p>
                    </div>`;

                case 'text':
                    return `<div class="space-y-4">
                        <label class="block">
                            <span class="text-lg font-medium text-gray-700">${q.question}${q.required?'<span class="text-red-500 ml-1">*</span>':''}</span>
                            ${q.helper?`<p class="text-sm text-gray-500 mt-1">${q.helper}</p>`:''}
                            <input type="text" class="mt-2 block w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                                   value="${value||''}" placeholder="${q.helper?q.helper.replace('예: ',''):'입력하세요'}"
                                   oninput="surveyState.formData['${q.key}']=this.value; updateButtonState();">
                        </label>
                    </div>`;

                case 'number':
                    return `<div class="space-y-4">
                        <label class="block">
                            <span class="text-lg font-medium text-gray-700">${q.question}${q.required?'<span class="text-red-500 ml-1">*</span>':''}</span>
                            ${q.helper?`<p class="text-sm text-gray-500 mt-1">${q.helper}</p>`:''}
                            <div class="mt-2 flex items-center">
                                <input type="number" class="block w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                                       value="${value||''}" placeholder="숫자를 입력하세요"
                                       oninput="surveyState.formData['${q.key}']=this.value; updateButtonState();">
                                ${q.unit?`<span class="ml-3 text-gray-600">${q.unit}</span>`:''}
                            </div>
                        </label>
                    </div>`;

                case 'money':
                    return `<div class="space-y-4">
                        <label class="block">
                            <span class="text-lg font-medium text-gray-700">${q.question}${q.required?'<span class="text-red-500 ml-1">*</span>':''}</span>
                            ${q.helper?`<p class="text-sm text-gray-500 mt-1">${q.helper}</p>`:''}
                            <div class="mt-2 flex items-center">
                                <input type="text" inputmode="numeric"
                                       class="block w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                                       value="${fmtMoney(value)}" placeholder="금액 입력 (예: 1,500,000)"
                                       oninput="const v=parseMoney(this.value); surveyState.formData['${q.key}']=v; this.value=v?v.toLocaleString('ko-KR'):''; updateButtonState();">
                                <span class="ml-3 text-gray-600">원</span>
                            </div>
                        </label>
                    </div>`;

                case 'radio':
                    return `<div class="space-y-4">
                        <div>
                            <span class="text-lg font-medium text-gray-700">${q.question}${q.required?'<span class="text-red-500 ml-1">*</span>':''}</span>
                            ${q.helper?`<p class="text-sm text-gray-500 mt-1">${q.helper}</p>`:''}
                        </div>
                        <div class="space-y-3">
                            ${q.options.map(opt=>`
                                <label class="flex items-center p-4 border-2 rounded-lg cursor-pointer hover:bg-blue-50 ${value===opt?'border-blue-500 bg-blue-50':'border-gray-300'}">
                                    <input type="radio" name="${q.key}" value="${opt}" class="w-5 h-5 text-blue-600"
                                           ${value===opt?'checked':''}
                                           onchange="surveyState.formData['${q.key}']=this.value; render();">
                                    <span class="ml-3 text-gray-700">${opt}</span>
                                </label>`).join('')}
                        </div>
                    </div>`;

                case 'checkbox':
                    const sel = Array.isArray(value)?value:[];
                    return `<div class="space-y-4">
                        <div>
                            <span class="text-lg font-medium text-gray-700">${q.question}${q.required?'<span class="text-red-500 ml-1">*</span>':''}</span>
                            ${q.helper?`<p class="text-sm text-gray-500 mt-1">${q.helper}</p>`:''}
                        </div>
                        <div class="space-y-3">
                            ${q.options.map(opt=>{
                                const chk=sel.includes(opt);
                                return `<label class="flex items-center p-4 border-2 rounded-lg cursor-pointer hover:bg-blue-50 ${chk?'border-blue-500 bg-blue-50':'border-gray-300'}">
                                    <input type="checkbox" value="${opt}" class="w-5 h-5 text-blue-600 rounded"
                                           ${chk?'checked':''}
                                           onchange="
                                               const cur=surveyState.formData['${q.key}']||[];
                                               surveyState.formData['${q.key}']=this.checked?[...cur,'${opt}']:cur.filter(v=>v!=='${opt}');
                                               render();">
                                    <span class="ml-3 text-gray-700">${opt}</span>
                                </label>`;
                            }).join('')}
                        </div>
                    </div>`;

                case 'area_by_variety':
                    const varieties = surveyState.formData.garlic_varieties||[];
                    if (!varieties.length) return '';
                    const areaData = value||{};
                    return `<div class="space-y-4">
                        <div>
                            <span class="text-lg font-medium text-gray-700">${q.question}${q.required?'<span class="text-red-500 ml-1">*</span>':''}</span>
                            ${q.helper?`<p class="text-sm text-gray-500 mt-1">${q.helper}</p>`:''}
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            ${varieties.map(vr=>{
                                if (vr==='기타') return `<div class="bg-gray-50 p-4 rounded-lg col-span-full">
                                    <label class="block mb-3">
                                        <span class="text-gray-700 font-medium mb-2 block">기타 품종명</span>
                                        <input type="text" class="w-full px-3 py-2 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                               value="${areaData['기타_품종명']||''}" placeholder="예: 의성, 서산"
                                               oninput="if(!surveyState.formData['${q.key}'])surveyState.formData['${q.key}']={};surveyState.formData['${q.key}']['기타_품종명']=this.value; updateButtonState();">
                                    </label>
                                    <label class="block">
                                        <span class="text-gray-700 font-medium mb-2 block">기타 품종 재배면적</span>
                                        <div class="flex items-center gap-2">
                                            <input type="number" class="flex-1 px-3 py-2 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                                   value="${areaData['기타']||''}" placeholder="면적 입력" min="0"
                                                   oninput="if(!surveyState.formData['${q.key}'])surveyState.formData['${q.key}']={};surveyState.formData['${q.key}']['기타']=this.value; updateButtonState();">
                                            <span class="text-gray-600 whitespace-nowrap">${q.unit}</span>
                                        </div>
                                    </label>
                                </div>`;
                                return `<div class="bg-gray-50 p-4 rounded-lg">
                                    <label class="block">
                                        <span class="text-gray-700 font-medium mb-2 block">${vr}</span>
                                        <div class="flex items-center gap-2">
                                            <input type="number" class="w-full px-3 py-2 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                                   value="${areaData[vr]||''}" placeholder="면적 입력" min="0"
                                                   oninput="if(!surveyState.formData['${q.key}'])surveyState.formData['${q.key}']={};surveyState.formData['${q.key}']['${vr}']=this.value; updateButtonState();">
                                            <span class="text-gray-600 whitespace-nowrap">${q.unit}</span>
                                        </div>
                                    </label>
                                </div>`;
                            }).join('')}
                        </div>
                    </div>`;

                // ★ 자가+임차 면적 분리 입력
                case 'land_area_split':
                    const selfArea = surveyState.formData.land_self_area||'';
                    const rentArea = surveyState.formData.land_rent_area||'';
                    return `<div class="space-y-4">
                        <span class="text-lg font-medium text-gray-700">${q.question}</span>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-3">
                            <div class="bg-green-50 p-4 rounded-lg">
                                <label class="block">
                                    <span class="text-gray-700 font-medium mb-2 block">🏡 자가 소유 면적</span>
                                    <div class="flex items-center gap-2">
                                        <input type="number" class="w-full px-3 py-2 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                               value="${selfArea}" placeholder="면적 입력" min="0"
                                               oninput="surveyState.formData.land_self_area=this.value;">
                                        <span class="text-gray-600 whitespace-nowrap">평</span>
                                    </div>
                                </label>
                            </div>
                            <div class="bg-orange-50 p-4 rounded-lg">
                                <label class="block">
                                    <span class="text-gray-700 font-medium mb-2 block">📋 임차 면적</span>
                                    <div class="flex items-center gap-2">
                                        <input type="number" class="w-full px-3 py-2 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500"
                                               value="${rentArea}" placeholder="면적 입력" min="0"
                                               oninput="surveyState.formData.land_rent_area=this.value;">
                                        <span class="text-gray-600 whitespace-nowrap">평</span>
                                    </div>
                                </label>
                            </div>
                        </div>
                    </div>`;

                // ★ 농기계별 구입년도 입력
                case 'equipment_years':
                    const equips = (surveyState.formData.owned_equipment||[]).filter(e=>e!=='없음');
                    if (!equips.length) return '';
                    const yearData = surveyState.formData.equipment_purchase_years||{};
                    const curYear = new Date().getFullYear();
                    const yearOptions = Array.from({length: curYear-1979}, (_,i)=>curYear-i)
                        .map(y=>`<option value="${y}" ${yearData[equips[0]]===String(y)?'selected':''}>${y}년</option>`);
                    return `<div class="space-y-4">
                        <div>
                            <span class="text-lg font-medium text-gray-700">${q.question}</span>
                            ${q.helper?`<p class="text-sm text-gray-500 mt-1">${q.helper}</p>`:''}
                        </div>
                        <div class="space-y-3">
                            ${equips.map(eq=>{
                                const selYear = yearData[eq]||'';
                                return `<div class="bg-gray-50 p-4 rounded-lg flex items-center gap-4">
                                    <span class="text-gray-700 font-medium w-24 flex-shrink-0">🚜 ${eq}</span>
                                    <select class="flex-1 px-3 py-2 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                            onchange="if(!surveyState.formData.equipment_purchase_years)surveyState.formData.equipment_purchase_years={};surveyState.formData.equipment_purchase_years['${eq}']=this.value;">
                                        <option value="">구입년도 선택</option>
                                        ${Array.from({length: curYear-1979}, (_,i)=>curYear-i)
                                            .map(y=>`<option value="${y}" ${selYear===String(y)?'selected':''}>${y}년</option>`).join('')}
                                    </select>
                                </div>`;
                            }).join('')}
                        </div>
                    </div>`;

                default:
                    return '<p class="text-gray-500">알 수 없는 질문 유형입니다.</p>';
            }
        }

        // ── 화면 렌더링 ───────────────────────────
        function render() {
            const app = document.getElementById('app');
            const vq = getVisibleQuestions();
            const curr = vq[surveyState.currentStep];
            const isLast = surveyState.currentStep === vq.length-1;
            const isFirst = surveyState.currentStep === 0;

            app.innerHTML = `
                <div class="max-w-3xl mx-auto p-6">
                    <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
                        <div class="flex justify-between items-center">
                            <div>
                                <h1 class="text-2xl font-bold text-gray-800">마늘 생산비 조사</h1>
                                <p class="text-sm text-blue-600">1단계: 기본정보</p>
                            </div>
                            <a href="index.html" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300">메인으로</a>
                        </div>
                        <div class="mt-4">
                            <div class="flex justify-between text-sm text-gray-600 mb-2">
                                <span>진행률</span>
                                <span>${surveyState.currentStep+1} / ${vq.length}</span>
                            </div>
                            <div class="w-full bg-gray-200 rounded-full h-2">
                                <div class="bg-blue-600 h-2 rounded-full transition-all duration-300"
                                     style="width:${((surveyState.currentStep+1)/vq.length)*100}%"></div>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white rounded-lg shadow-lg p-8 mb-6 fade-in">
                        ${curr.section&&curr.type!=='section_intro'?`<div class="text-sm font-semibold text-blue-600 mb-4">${curr.section}</div>`:''}
                        ${renderQuestion(curr)}
                    </div>

                    <div class="flex gap-4">
                        <button onclick="prevStep()"
                                class="flex-1 px-6 py-3 border-2 border-gray-300 text-gray-700 rounded-lg font-medium hover:bg-gray-50 disabled:opacity-50"
                                ${isFirst?'disabled':''}>← 이전</button>
                        ${!isLast ? `
                            <button id="nextBtn" onclick="nextStep()"
                                    style="opacity:${!canMoveForward()?'0.4':'1'}; cursor:${!canMoveForward()?'not-allowed':'pointer'}"
                                    class="flex-1 px-6 py-3 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700">다음 →</button>
                        ` : `
                            <button id="submitBtn" onclick="submitSurvey()"
                                    style="opacity:${!canMoveForward()?'0.4':'1'}; cursor:${!canMoveForward()?'not-allowed':'pointer'}"
                                    class="flex-1 px-6 py-3 bg-green-600 text-white rounded-lg font-medium hover:bg-green-700">✓ 제출하기</button>
                        `}
                    </div>
                </div>
            `;
        }

        // ── 초기화 (★ 서버 동기화 포함) ─────────
        async function init() {
            const phone = localStorage.getItem('garlic_survey_phone');
            if (!phone) {
                alert('로그인이 필요합니다');
                window.location.href = 'index.html';
                return;
            }
            surveyState.phoneNumber = phone;

            // ★ 서버에서 최신 데이터 동기화 (다른 기기에서 입력한 내용 불러오기)
            await syncFromServer(phone);

            loadData();
            render();
        }

        init();
    </script>
</body>
</html>
