<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마늘 생산비 조사 - 8단계: 수확 및 판매</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-orange-50 to-red-50 min-h-screen">
    <div id="app"></div>

    <script>
        const surveyState = {
            view: 'intro', // 'intro', 'list', 'form'
            formData: {},
            phoneNumber: '',
            stage: 8,
            records: [],
            editingId: null
        };


        // ★ 서버 동기화 함수 (기기 간 이어쓰기)
        // replaced
async function syncFromServer_old_disabled(phone) {
            try {
                const resp = await fetch(`${SCRIPT_URL}?action=load&phone=${encodeURIComponent(phone)}`);
                if (!resp.ok) throw new Error();
                const result = await resp.json();
                if (result.success && result.data && Object.keys(result.data).length > 0) {
                    const key = `garlic_survey_${phone}`;
                    const local = JSON.parse(localStorage.getItem(key)||'{}');
                    localStorage.setItem(key, JSON.stringify(Object.assign({}, local, result.data)));
                }
            } catch(e) { /* 로컬 데이터 사용 */ }
        }


        // ★ 작업 인원 표시/숨김
        function updateWorkerFields(method) {
            var section  = document.getElementById('workerSection');
            var outDiv   = document.getElementById('outsourceWorkers');
            var selfDiv  = document.getElementById('selfWorkers');
            if (!section || !outDiv || !selfDiv) return;
            var m = String(method || '').trim();
            var showOut  = (m === '위탁 (남에게 맡김)' || m === '위탁+자가 (함께 작업)');
            var showSelf = (m === '자가 작업 (직접 함)'  || m === '위탁+자가 (함께 작업)');
            outDiv.style.display  = showOut  ? 'block' : 'none';
            selfDiv.style.display = showSelf ? 'block' : 'none';
            section.style.display = (showOut || showSelf) ? 'block' : 'none';
        }

        // ★ 천단위 콤마 유틸리티
        function fmtMoney(v) {
            const n = parseInt(String(v||'').replace(/[^0-9]/g,''))||0;
            return n === 0 ? '' : n.toLocaleString('ko-KR');
        }

        // ★ 금액 안전 표시 (0이거나 없으면 빈칸)
        function fmtAmt(v) {
            var n = parseInt(String(v || '').replace(/[^0-9]/g, '')) || 0;
            return n > 0 ? n.toLocaleString('ko-KR') + '원' : '';
        }
        function parseMoney(v) {
            return parseInt(String(v||'').replace(/[^0-9]/g,''))||0;
        }

        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwNoDIt4MVKwk3ZlAVQCI2DG5MqoeVPklOC-qgzwPvV4qBlTBYlL2FDYgnXTpxj-jdd/exec';
        // 작업 종류별 옵션
        const workTypeOptions = {
            '굴취수확': {
                methods: ['위탁 (남에게 맡김)', '자가 작업 (직접 함)', '위탁+자가 (함께 작업)'],
                fields: ['date', 'method', 'material_cost', 'labor_cost', 'harvest_amount', 'memo']
            },
            '건조': {
                methods: ['위탁건조', '건조기 사용', '선풍기 사용', '자연 건조'],
                fields: ['date', 'method', 'material_cost', 'labor_cost', 'memo']
            },
            '줄기제거': {
                methods: ['위탁 (남에게 맡김)', '자가 작업 (직접 함)', '위탁+자가 (함께 작업)'],
                fields: ['date', 'method', 'material_cost', 'labor_cost', 'memo']
            },
            '수확(담기)': {
                methods: ['위탁 (남에게 맡김)', '자가 작업 (직접 함)', '위탁+자가 (함께 작업)'],
                fields: ['date', 'method', 'material_cost', 'labor_cost', 'memo']
            },
            '선별포장': {
                methods: ['위탁 (남에게 맡김)', '자가 작업 (직접 함)', '위탁+자가 (함께 작업)'],
                fields: ['date', 'method', 'material_cost', 'labor_cost', 'memo']
            },
            '저장': {
                methods: ['위탁 (남에게 맡김)', '자가 작업 (직접 함)', '위탁+자가 (함께 작업)'],
                fields: ['date', 'method', 'material_cost', 'labor_cost', 'memo']
            },
            '수매운반': {
                methods: ['위탁 (남에게 맡김)', '자가 작업 (직접 함)', '위탁+자가 (함께 작업)'],
                fields: ['date', 'method', 'material_cost', 'labor_cost', 'memo'],
                materialCostHelper: '유류비, 운송비 등'
            },
            '판매': {
                methods: ['산지 유통인/수집상 대상 판매', '농협 공판장/도매시장 경매', '계약 재배 및 출하', '가공업체 대상 판매', '직접 판매(장터/온라인/택배 등)'],
                fields: ['date', 'method', 'sales_quantity', 'sales_amount', 'shipping_cost', 'buyer', 'memo']
            }
        };

        function updateMethodOptions(workType) {
            const methodContainer = document.getElementById('methodContainer');
            const salesFields = document.getElementById('salesFields');
            const standardFields = document.getElementById('standardFields');
            const harvestAmountField = document.getElementById('harvestAmountField');
            
            if (!methodContainer) return;

            const config = workTypeOptions[workType];
            if (config) {
                methodContainer.style.display = 'block';
                const methodSelect = document.getElementById('method');
                if (methodSelect) {
                    methodSelect.innerHTML = '<option value=""></option>' + 
                        config.methods.map(m => `<option value="${m}">${m}</option>`).join('');
                methodSelect.onchange = function(){ updateWorkerFields(this.value); };
                }

                // 판매인 경우 판매 필드 표시
                if (workType === '판매') {
                    if (salesFields) salesFields.style.display = 'block';
                    if (standardFields) standardFields.style.display = 'none';
                    if (harvestAmountField) harvestAmountField.style.display = 'none';
                } else {
                    if (salesFields) salesFields.style.display = 'none';
                    if (standardFields) standardFields.style.display = 'block';
                    
                    // 굴취수확인 경우 수확량 필드 표시
                    if (harvestAmountField) {
                        harvestAmountField.style.display = workType === '굴취수확' ? 'block' : 'none';
                    }
                    
                    // 수매운반인 경우 자재비 헬퍼 표시
                    const materialCostHelper = document.getElementById('materialCostHelper');
                    if (materialCostHelper) {
                        materialCostHelper.style.display = workType === '수매운반' ? 'block' : 'none';
                    }
                }
            }
        }

        function saveData() {
            if (surveyState.phoneNumber) {
                const dataToSave = {
                    stage_8_records: surveyState.records,
                    stage_8_summary: calculateSummary(),
                    completed_stage_8: surveyState.formData.completed_stage_8 || false,
                    all_stages_completed: surveyState.formData.all_stages_completed || false,
                    savedAt: new Date().toISOString(),
                    stage: surveyState.stage,
                    phoneNumber: surveyState.phoneNumber
                };
                
                const allData = localStorage.getItem(`garlic_survey_${surveyState.phoneNumber}`);
                const parsed = allData ? JSON.parse(allData) : {};
                Object.assign(parsed, dataToSave);
                
                localStorage.setItem(`garlic_survey_${surveyState.phoneNumber}`, JSON.stringify(parsed));
            }
        }

        function loadData() {
            if (surveyState.phoneNumber) {
                const savedData = localStorage.getItem(`garlic_survey_${surveyState.phoneNumber}`);
                if (savedData) {
                    const parsed = JSON.parse(savedData);
                    surveyState.records = parsed.stage_8_records || [];
                    surveyState.formData = parsed;
                    return true;
                }
            }
            return false;
        }

        function calculateSummary() {
            const byType = {};
            surveyState.records.forEach(r => {
                if (!byType[r.type]) {
                    byType[r.type] = {
                        count: 0,
                        total_material_cost: 0,
                        total_labor_cost: 0,
                        total_sales: 0,
                        total_quantity: 0
                    };
                }
                byType[r.type].count++;
                byType[r.type].total_material_cost += parseInt(r.material_cost || 0);
                byType[r.type].total_labor_cost += parseInt(r.labor_cost || 0);
                
                if (r.type === '판매') {
                    byType[r.type].total_sales += parseInt(r.sales_amount || 0);
                    byType[r.type].total_quantity += parseInt(r.sales_quantity || 0);
                }
            });
            
            return byType;
        }

        function addOrUpdateRecord(formData) {
            if (surveyState.editingId !== null) {
                // 수정
                const index = surveyState.records.findIndex(r => r.id === surveyState.editingId);
                if (index !== -1) {
                    surveyState.records[index] = {
                        ...formData,
                        id: surveyState.editingId
                    };
                }
                surveyState.editingId = null;
            } else {
                // 추가
                surveyState.records.push({
                    ...formData,
                    id: Date.now()
                });
            }
            
            saveData();
            surveyState.view = 'list';
            render();
        }

        function editRecord(id) {
            const record = surveyState.records.find(r => r.id === id);
            if (!record) return;
            
            surveyState.editingId = id;
            surveyState.view = 'form';
            render();
            
            // 폼 필드 채우기
            setTimeout(() => {
                document.getElementById('date').value = record.date;
                
                const typeRadio = document.querySelector(`input[name="type"][value="${record.type}"]`);
                if (typeRadio) {
                    typeRadio.checked = true;
                    updateMethodOptions(record.type);
                }
                
                setTimeout(() => {
                    const methodSelect = document.getElementById('method');
                    if (methodSelect) methodSelect.value = record.method;
                    
                    if (record.type === '판매') {
                        document.getElementById('sales_quantity').value = record.sales_quantity || '';
                        String(parseMoney(document.getElementById('sales_amount').value)) = record.sales_amount || '';
                        String(parseMoney(document.getElementById('shipping_cost').value)) = record.shipping_cost || '';
                        document.getElementById('buyer').value = record.buyer || '';
                    } else {
                        document.getElementById('material_cost').value = record.material_cost || '';
                        document.getElementById('labor_cost').value = record.labor_cost || '';
                        if (record.type === '굴취수확') {
                            document.getElementById('harvest_amount').value = record.harvest_amount || '';
                        }
                    }
                    
                    document.getElementById('memo').value = record.memo || '';
                }, 100);
            }, 100);
        }

        function deleteRecord(id) {
            if (confirm('이 기록을 삭제하시겠습니까?')) {
                surveyState.records = surveyState.records.filter(r => r.id !== id);
                saveData();
                render();
            }
        }

        function showAddForm() {
            surveyState.editingId = null;
            surveyState.view = 'form';
            render();
        }

        function cancelForm() {
            surveyState.editingId = null;
            surveyState.view = 'list';
            render();
        }

        let _isSubmitting = false;
        async function submitStage() {
            if (_isSubmitting) return;
            if (surveyState.records.length === 0) {
                alert('⚠️ 최소 1개 이상의 작업을 기록해야 제출할 수 있습니다.');
                return;
            }

            const summary = calculateSummary();
            
            const submitData = {
                timestamp: new Date().toISOString(),
                phoneNumber: surveyState.phoneNumber,
                stage: 8,
                stage_8_records: surveyState.records,
                stage_8_summary: summary,
                completed_stage_8: true,
                all_stages_completed: true
            };

            _isSubmitting = true;
            // ★ 즉시 버튼 피드백
            const submitBtn = document.getElementById('submitStageBtn');
            if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = '⏳ 저장 중...'; }
            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(submitData)
                });

                surveyState.formData.completed_stage_8 = true;
                surveyState.formData.all_stages_completed = true;
                saveData();

                alert('🎉 축하합니다!\n\n전체 8단계 마늘 생산비 조사가 완료되었습니다!\n소중한 시간 내어 참여해주셔서 감사합니다.');
                _isSubmitting = false; window.location.href = 'index.html';
            } catch (error) {
                console.error('제출 오류:', error);
                alert('✅ 8단계가 저장되었습니다!\n\n전체 조사가 완료되었습니다!');
                _isSubmitting = false; window.location.href = 'index.html';
            }
        }

        function handleFormSubmit() {
            
            const workType = document.querySelector('input[name="type"]:checked').value;
            const method = document.getElementById('method').value;
            
            if (!method) {
                alert('작업 방법을 선택해주세요.');
                return;
            }
            
            const formData = {
                date: document.getElementById('date').value,
                type: workType,
                method: method,
                memo: document.getElementById('memo').value
            };

            if (workType === '판매') {
                formData.sales_quantity = document.getElementById('sales_quantity').value || '0';
                formData.sales_amount = String(parseMoney(String(parseMoney(document.getElementById('sales_amount').value))));
                formData.shipping_cost = String(parseMoney(String(parseMoney(document.getElementById('shipping_cost').value))));
                formData.buyer = document.getElementById('buyer').value;
            } else {
                formData.material_cost = document.getElementById('material_cost').value || '0';
                formData.labor_cost = document.getElementById('labor_cost').value || '0';
                
                if (workType === '굴취수확') {
                    formData.harvest_amount = document.getElementById('harvest_amount').value || '';
                }
            }


            const workerData = {
                outsource_male:   document.getElementById('outsource_male')?.value   || '',
                outsource_female: document.getElementById('outsource_female')?.value || '',
                self_male:        document.getElementById('self_male')?.value        || '',
                self_female:      document.getElementById('self_female')?.value      || '',
            };
            Object.assign(formData, workerData);
            addOrUpdateRecord(formData);
        }

        function render() {
            const app = document.getElementById('app');
            const savedPhone = localStorage.getItem('garlic_survey_phone');
            
            if (!savedPhone) {
                app.innerHTML = `
                    <div class="min-h-screen flex items-center justify-center p-4">
                        <div class="max-w-md w-full bg-white rounded-lg shadow-lg p-8 text-center">
                            <div class="bg-orange-100 rounded-full w-20 h-20 flex items-center justify-center mx-auto mb-4">
                                <span class="text-4xl">⚠️</span>
                            </div>
                            <h2 class="text-2xl font-bold text-gray-800 mb-4">로그인이 필요합니다</h2>
                            <p class="text-gray-600 mb-6">먼저 메인 화면에서 전화번호로 로그인해주세요.</p>
                            <a href="index.html" class="inline-block px-6 py-3 bg-orange-600 text-white rounded-lg font-medium hover:bg-orange-700">
                                메인 화면으로 이동
                            </a>
                        </div>
                    </div>
                `;
                return;
            }

            if (!surveyState.phoneNumber) {
                surveyState.phoneNumber = savedPhone;
                loadData();
            }

            if (surveyState.view === 'intro') {
                renderIntro(app);
            } else if (surveyState.view === 'form') {
                renderForm(app);
            } else {
                renderList(app);
            }
        }

        function renderIntro(app) {
            app.innerHTML = `
                <div class="min-h-screen flex items-center justify-center p-4">
                    <div class="max-w-2xl w-full bg-white rounded-lg shadow-lg p-8 text-center space-y-6">
                        <div class="bg-gradient-to-r from-orange-100 to-red-100 rounded-full w-20 h-20 flex items-center justify-center mx-auto">
                            <span class="text-4xl">🌾</span>
                        </div>
                        <h1 class="text-3xl font-bold text-gray-800">마늘 생산비 조사</h1>
                        <p class="text-xl text-orange-600 font-medium">8단계: 수확 및 판매 (마지막!)</p>
                        <p class="text-lg text-gray-700">수확부터 판매까지의 작업을 기록합니다</p>
                        
                        <div class="bg-blue-50 p-6 rounded-lg text-left space-y-3">
                            <h3 class="font-bold text-gray-800 mb-2">📝 기록할 작업 종류</h3>
                            <div class="text-sm text-gray-700 space-y-1">
                                <p>✅ 굴취수확 - 마늘 캐기</p>
                                <p>✅ 건조 - 마늘 말리기</p>
                                <p>✅ 줄기제거 - 마늘대 자르기</p>
                                <p>✅ 수확(담기) - 수확 후 담기 작업</p>
                                <p>✅ 선별포장 - 등급 분류 및 포장</p>
                                <p>✅ 저장 - 수확 후 저장 작업</p>   
                                <p>✅ 수매운반 - 수매 및 운반</p>
                                <p>✅ 판매 - 출하 및 판매</p>
                            </div>
                        </div>
                        
                        <div class="bg-yellow-50 border-l-4 border-yellow-400 p-4 rounded text-left">
                            <p class="text-sm text-gray-700">
                                💡 <strong>작업일지 방식</strong><br>
                                각 작업을 날짜별로 여러 번 기록할 수 있습니다.<br>
                                예: 판매를 3번 나눠서 한 경우 → 3개 레코드 추가
                            </p>
                        </div>

                        <div class="flex gap-4 justify-center">
                            <a href="index.html" class="px-6 py-3 bg-gray-200 text-gray-700 rounded-lg font-medium hover:bg-gray-300">
                                ← 메인으로
                            </a>
                            <button onclick="surveyState.view='list'; render();" class="px-8 py-3 bg-orange-600 text-white rounded-lg font-medium hover:bg-orange-700 text-lg">
                                시작하기 →
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderList(app) {
            const isAlreadySubmitted = surveyState.formData.completed_stage_8;
            const summary = calculateSummary();
            
            app.innerHTML = `
                <div class="min-h-screen p-4">
                    <div class="max-w-4xl mx-auto">
                        <!-- 헤더 -->
                        <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
                            <div class="flex justify-between items-center mb-4">
                                <div>
                                    <h1 class="text-2xl font-bold text-gray-800">8단계: 수확 및 판매</h1>
                                    <p class="text-sm text-gray-600">마지막 단계입니다!</p>
                                </div>
                                <div class="flex gap-2">
                                    <a href="index.html" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300">
                                        메인
                                    </a>
                                </div>
                            </div>
                            
                            ${surveyState.records.length > 0 ? `
                                <div class="bg-blue-50 p-4 rounded-lg">
                                    <h3 class="font-bold text-gray-800 mb-2">📊 작업 요약</h3>
                                    <div class="text-sm text-gray-700 grid grid-cols-2 md:grid-cols-3 gap-2">
                                        ${Object.keys(summary).map(type => `
                                            <div>
                                                <strong>${type}:</strong> ${summary[type].count}회
                                                ${type === '판매' && summary[type].total_quantity > 0 ? 
                                                    `<br><span class="text-xs">(${summary[type].total_quantity}kg / ${summary[type].total_sales.toLocaleString()}원)</span>` : 
                                                    ''}
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                            ` : ''}
                        </div>

                        <!-- 레코드 목록 -->
                        ${surveyState.records.length > 0 ? `
                            <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
                                <h2 class="text-xl font-bold text-gray-800 mb-4">
                                    입력된 작업 기록 (${surveyState.records.length}건)
                                </h2>
                                <div class="space-y-4">
                                    ${surveyState.records.sort((a, b) => new Date(a.date) - new Date(b.date)).map(record => `
                                        <div class="bg-white border-2 border-gray-200 rounded-lg p-4 hover:border-orange-400 transition-all">
                                            <div class="flex justify-between items-start">
                                                <div class="flex-1">
                                                    <div class="flex items-center gap-2 mb-2">
                                                        <span class="text-sm font-medium text-orange-600">📅 ${record.date}</span>
                                                        <span class="px-2 py-1 bg-orange-100 text-orange-700 text-xs rounded-full">
                                                            ${record.type}
                                                        </span>
                                                    </div>
                                                    <div class="text-sm text-gray-600 mb-2">
                                                        🔧 ${record.method}
                                                    </div>
                                                    
                                                    ${record.type === '판매' ? `
                                                        <div class="grid grid-cols-2 gap-2 text-sm">
                                                            <div>
                                                                <span class="text-gray-500">판매량:</span>
                                                                <span class="font-medium text-gray-900">${record.sales_quantity}kg</span>
                                                            </div>
                                                            <div>
                                                                <span class="text-gray-500">판매액:</span>
                                                                <span class="font-medium text-gray-900">${fmtAmt(record.sales_amount || 0)}</span>
                                                            </div>
                                                            ${record.shipping_cost && parseInt(record.shipping_cost) > 0 ? `
                                                                <div>
                                                                    <span class="text-gray-500">출하비용:</span>
                                                                    <span class="font-medium text-gray-900">${fmtAmt(record.shipping_cost)}</span>
                                                                </div>
                                                            ` : ''}

        // ★ 서버 동기화 (기기 간 이어쓰기)
        // replaced
async function syncFromServer_old_disabled(phone) {
            try {
                const resp = await fetch(`${SCRIPT_URL}?action=load&phone=${encodeURIComponent(phone)}`);
                if (!resp.ok) throw new Error();
                const result = await resp.json();
                if (result.success && result.data && Object.keys(result.data).length > 0) {
                    const key = `garlic_survey_${phone}`;
                    const local = JSON.parse(localStorage.getItem(key)||'{}');
                    localStorage.setItem(key, JSON.stringify(Object.assign({}, local, result.data)));
                }
            } catch(e) { /* 로컬 데이터 사용 */ }
        }

        // ★ POST 방식 서버 동기화 (CORS 문제 없음)
        async function syncFromServer(phone) {
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'cors',
                    headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
                    body: JSON.stringify({ action: 'load', phoneNumber: phone })
                });
                const result = await response.json();
                if (result && result.success && result.data && Object.keys(result.data).length > 1) {
                    const key = `garlic_survey_${phone}`;
                    const local = JSON.parse(localStorage.getItem(key)||'{}');
                    const flat = flattenData(result.data);
                    const merged = Object.assign({}, flattenData(local), flat);
                    localStorage.setItem(key, JSON.stringify(merged));
                    console.log('✅ 서버 동기화 완료');
                }
            } catch(e) {
                console.log('서버 동기화 실패:', e.message);
            }
        }


        // ★ 비동기 초기화
        async function init() {
            const phone = localStorage.getItem('garlic_survey_phone');
            if (!phone) { window.location.href = 'index.html'; return; }
            surveyState.phoneNumber = phone;
            await syncFromServer(phone);
            loadData();  // ★ 서버 동기화 후 데이터 로드
            surveyState.view = 'intro';
            render();
        }
        init();
