<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마늘 생산비 조사 - 6단계: 생육관리</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @media (max-width: 640px) {
            .survey-container { padding: 1rem; }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-emerald-50 to-teal-50 min-h-screen">
    <div id="app"></div>

    <script>
        const surveyState = {
            view: 'list', // 'list', 'form', 'intro', 'completion'
            formData: {},
            phoneNumber: '',
            stage: 6,
            records: [],
            editingId: null
        };


        // ★ 서버 동기화 함수 (기기 간 이어쓰기)
        // replaced
async function syncFromServer_old_disabled(phone) {
            try {
                const resp = await fetch(`${SCRIPT_URL}?action=load&phone=${encodeURIComponent(phone)}`);
                if (!resp.ok) throw new Error();
                const result = await resp.json();
                if (result.success && result.data && Object.keys(result.data).length > 0) {
                    const key = `garlic_survey_${phone}`;
                    const local = JSON.parse(localStorage.getItem(key)||'{}');
                    localStorage.setItem(key, JSON.stringify(Object.assign({}, local, result.data)));
                }
            } catch(e) { /* 로컬 데이터 사용 */ }
        }


        // ★ 작업 인원 표시/숨김
        function updateWorkerFields(method) {
            var section  = document.getElementById('workerSection');
            var outDiv   = document.getElementById('outsourceWorkers');
            var selfDiv  = document.getElementById('selfWorkers');
            if (!section || !outDiv || !selfDiv) return;
            var m = String(method || '').trim();
            var showOut  = (m === '위탁 (남에게 맡김)' || m === '위탁+자가 (함께 작업)');
            var showSelf = (m === '자가 작업 (직접 함)'  || m === '위탁+자가 (함께 작업)');
            outDiv.style.display  = showOut  ? 'block' : 'none';
            selfDiv.style.display = showSelf ? 'block' : 'none';
            section.style.display = (showOut || showSelf) ? 'block' : 'none';
        }



        // ★ 날짜를 input[type=date]용 YYYY-MM-DD로 변환
        function toInputDate(d) {
            if (!d) return '';
            var s = String(d);
            // 이미 YYYY-MM-DD 형식
            if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
            // Date 객체 문자열 또는 기타
            var dt = new Date(s);
            if (!isNaN(dt)) {
                var y = dt.getFullYear();
                var m = String(dt.getMonth()+1).padStart(2,'0');
                var dd = String(dt.getDate()).padStart(2,'0');
                return y + '-' + m + '-' + dd;
            }
            // YYYY.M.D 형식
            var match = s.match(/(\d{4})\.(\d{1,2})\.(\d{1,2})/);
            if (match) {
                return match[1] + '-' + String(match[2]).padStart(2,'0') + '-' + String(match[3]).padStart(2,'0');
            }
            return s;
        }

        // ★ 날짜 포맷 변환 (2026-03-31 → 2026.3.31)
        function fmtDate(d) {
            if (!d) return '';
            var s = String(d);
            // Date 객체 문자열인 경우
            if (s.indexOf('GMT') !== -1 || s.indexOf('00:00:00') !== -1) {
                var dt = new Date(s);
                if (!isNaN(dt)) return dt.getFullYear() + '.' + (dt.getMonth()+1) + '.' + dt.getDate();
            }
            // YYYY-MM-DD 형식
            var m = s.match(/(\d{4})[-./](\d{1,2})[-./](\d{1,2})/);
            if (m) return m[1] + '.' + parseInt(m[2]) + '.' + parseInt(m[3]);
            return s;
        }

        // ★ 천단위 콤마 유틸리티
        function fmtMoney(v) {
            const n = parseInt(String(v||'').replace(/[^0-9]/g,''))||0;
            return n === 0 ? '' : n.toLocaleString('ko-KR');
        }

        // ★ 금액 안전 표시 (0이거나 없으면 빈칸)
        function fmtAmt(v) {
            var n = parseInt(String(v || '').replace(/[^0-9]/g, '')) || 0;
            return n > 0 ? n.toLocaleString('ko-KR') + '원' : '';
        }
        function parseMoney(v) {
            return parseInt(String(v||'').replace(/[^0-9]/g,''))||0;
        }

        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwNoDIt4MVKwk3ZlAVQCI2DG5MqoeVPklOC-qgzwPvV4qBlTBYlL2FDYgnXTpxj-jdd/exec';

        // 작업 종류별 방법 옵션
        const methodOptions = {
            '웃거름(추비)': ['위탁 (남에게 맡김)', '자가 작업 (직접 함)', '위탁+자가 (함께 작업)'],
            '복토': ['위탁 (남에게 맡김)', '자가 작업 (직접 함)', '위탁+자가 (함께 작업)'],
            '김매기': ['위탁 (남에게 맡김)', '자가 작업 (직접 함)', '위탁+자가 (함께 작업)'],
            '농약살포(살균제/살충제/제초제)': ['위탁 (남에게 맡김)', '자가 작업 (직접 함)', '위탁+자가 (함께 작업)'],
            '영양제': ['위탁 (남에게 맡김)', '자가 작업 (직접 함)', '위탁+자가 (함께 작업)'],
            '관수(물주기)': ['스프링클러', '점적관수', '호스(수동)']
        };

        function updateMethodOptions(workType) {
            const methodContainer = document.getElementById('methodContainer');
            if (!methodContainer) return;

            if (methodOptions[workType] && methodOptions[workType].length > 0) {
                methodContainer.style.display = 'block';
                const methodSelect = document.getElementById('method');
                if (methodSelect) {
                    methodSelect.innerHTML = '<option value=""></option>' + 
                        methodOptions[workType].map(option => `<option value="${option}">${option}</option>`).join('');
                methodSelect.onchange = function(){ updateWorkerFields(this.value); };
                }
            } else {
                methodContainer.style.display = 'none';
            }
        }

        function saveData() {
            if (surveyState.phoneNumber) {
                const dataToSave = {
                    stage_6_records: surveyState.records,
                    stage_6_summary: calculateSummary(),
                    completed_stage_6: surveyState.formData.completed_stage_6 || false,
                    savedAt: new Date().toISOString(),
                    stage: surveyState.stage,
                    phoneNumber: surveyState.phoneNumber
                };
                
                const allData = localStorage.getItem(`garlic_survey_${surveyState.phoneNumber}`);
                const parsed = allData ? JSON.parse(allData) : {};
                Object.assign(parsed, dataToSave);
                
                localStorage.setItem(`garlic_survey_${surveyState.phoneNumber}`, JSON.stringify(parsed));
            }
        }

        function loadData() {
            if (surveyState.phoneNumber) {
                const savedData = localStorage.getItem(`garlic_survey_${surveyState.phoneNumber}`);
                if (savedData) {
                    const parsed = JSON.parse(savedData);
                    surveyState.records = parsed.stage_6_records || [];
                    surveyState.formData = parsed;
                    return true;
                }
            }
            return false;
        }

        function calculateSummary() {
            const totalRecords = surveyState.records.length;
            const totalMaterialCost = surveyState.records.reduce((sum, r) => sum + ((parseInt(r.material_cost)||0) || 0), 0);
            const totalLaborCost = surveyState.records.reduce((sum, r) => sum + ((parseInt(r.labor_cost)||0) || 0), 0);
            
            return {
                total_records: totalRecords,
                total_material_cost: totalMaterialCost,
                total_labor_cost: totalLaborCost,
                total_cost: totalMaterialCost + totalLaborCost
            };
        }

        function addOrUpdateRecord(recordData) {
            if (surveyState.editingId !== null) {
                // 수정
                const index = surveyState.records.findIndex(r => r.id === surveyState.editingId);
                if (index !== -1) {
                    surveyState.records[index] = { ...recordData, id: surveyState.editingId };
                }
                surveyState.editingId = null;
            } else {
                // 추가
                const newId = surveyState.records.length > 0 
                    ? Math.max(...surveyState.records.map(r => r.id)) + 1 
                    : 1;
                surveyState.records.push({ ...recordData, id: newId });
            }
            saveData();
            surveyState.view = 'list';
            render();
        }

        function editRecord(id) {
            surveyState.editingId = id;
            surveyState.view = 'form';
            render();
        }

        function deleteRecord(id) {
            if (confirm('이 작업 기록을 삭제하시겠습니까?')) {
                surveyState.records = surveyState.records.filter(r => r.id !== id);
                saveData();
                render();
            }
        }

        function showAddForm() {
            surveyState.editingId = null;
            surveyState.view = 'form';
            render();
        }

        function cancelForm() {
            surveyState.editingId = null;
            surveyState.view = 'list';
            render();
        }

        let _isSubmitting = false;
        async function submitStage() {
            if (_isSubmitting) return;
            if (surveyState.records.length === 0) {
                alert('⚠️ 최소 1개 이상의 작업을 기록해야 제출할 수 있습니다.');
                return;
            }

            const summary = calculateSummary();
            
            const submitData = {
                timestamp: new Date().toISOString(),
                phoneNumber: surveyState.phoneNumber,
                stage: 6,
                stage_6_records: surveyState.records,
                stage_6_summary: summary,
                completed_stage_6: true
            };

            _isSubmitting = true;
            // ★ 즉시 버튼 피드백
            const submitBtn = document.getElementById('submitStageBtn');
            if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = '⏳ 저장 중...'; }
            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(submitData)
                });

                surveyState.formData.completed_stage_6 = true;
                saveData();

                alert('✅ 6단계가 제출되었습니다!\n\n메인 화면으로 돌아가 다음 단계를 진행하시거나,\n언제든지 다시 접속하여 수정할 수 있습니다.');
                _isSubmitting = false; window.location.href = 'index.html';
            } catch (error) {
                console.error('제출 오류:', error);
                alert('✅ 6단계가 저장되었습니다!\n\n메인 화면으로 돌아가 다음 단계를 진행하세요.');
                _isSubmitting = false; window.location.href = 'index.html';
            }
        }

        function render() {
            const app = document.getElementById('app');
            const savedPhone = localStorage.getItem('garlic_survey_phone');
            
            if (!savedPhone) {
                app.innerHTML = `<div class="min-h-screen flex items-center justify-center p-4"><div class="max-w-md w-full bg-white rounded-lg shadow-lg p-8 text-center"><div class="bg-emerald-100 rounded-full w-20 h-20 flex items-center justify-center mx-auto mb-4"><span class="text-4xl">⚠️</span></div><h2 class="text-2xl font-bold text-gray-800 mb-4">로그인이 필요합니다</h2><p class="text-gray-600 mb-6">먼저 메인 화면에서 전화번호로 로그인해주세요.</p><a href="index.html" class="inline-block px-6 py-3 bg-emerald-600 text-white rounded-lg font-medium hover:bg-emerald-700">메인 화면으로 이동</a></div></div>`;
                return;
            }

            if (!surveyState.phoneNumber) {
                surveyState.phoneNumber = savedPhone;
                loadData();
            }

            if (surveyState.view === 'intro') {
                renderIntro(app);
            } else if (surveyState.view === 'list') {
                renderList(app);
            } else if (surveyState.view === 'form') {
                renderForm(app);
            }
        }

        function renderIntro(app) {
            app.innerHTML = `
                <div class="min-h-screen flex items-center justify-center p-4">
                    <div class="max-w-2xl w-full bg-white rounded-lg shadow-lg p-8 text-center space-y-6 fade-in">
                        <div class="bg-emerald-100 rounded-full w-20 h-20 flex items-center justify-center mx-auto">
                            <span class="text-4xl">🌿</span>
                        </div>
                        <h1 class="text-3xl font-bold text-gray-800">마늘 생산비 조사</h1>
                        <p class="text-xl text-emerald-600 font-medium">6단계: 생육관리</p>
                        <p class="text-lg text-gray-700">생육기간 관리 작업 기록</p>
                        <div class="bg-blue-50 p-6 rounded-lg text-left">
                            <h3 class="font-bold text-gray-800 mb-3">📝 작업 방식</h3>
                            <ul class="text-sm space-y-2 text-gray-700">
                                <li>✅ 작업할 때마다 즉시 기록</li>
                                <li>✅ 웃거름(추비), 복토, 김매기, 농약살포(살균제/살충제/제초제), 영양제, 관수(물주기) 등</li>
                                <li>✅ 날짜, 종류, 비용 입력</li>
                                <li>✅ 언제든지 추가/수정/삭제 가능</li>
                                <li>✅ 최소 1개 이상 기록 후 제출</li>
                            </ul>
                        </div>
                        <div class="flex gap-4 justify-center">
                            <a href="index.html" class="px-6 py-3 bg-gray-200 text-gray-700 rounded-lg font-medium hover:bg-gray-300">← 메인으로</a>
                            <button onclick="surveyState.view = 'list'; render();" class="px-8 py-3 bg-emerald-600 text-white rounded-lg font-medium hover:bg-emerald-700 text-lg">시작하기 →</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderList(app) {
            const summary = calculateSummary();
            const isAlreadySubmitted = surveyState.formData.completed_stage_6;
            
            const recordsHTML = surveyState.records.length > 0 
                ? surveyState.records.map(record => `
                    <div class="bg-gray-50 p-4 rounded-lg border-2 border-gray-200">
                        <div class="flex justify-between items-start mb-2">
                            <div class="flex-1">
                                <div class="flex items-center gap-2 mb-1">
                                    <span class="text-lg font-bold text-emerald-600">${record.type}</span>
                                    <span class="text-sm text-gray-500">${fmtDate(record.date)}</span>
                                </div>
                                <div class="text-sm text-gray-700 space-y-1">
                                    ${record.method ? `<p>🔧 작업방법: ${record.method}</p>
                                    ${(()=>{
                                        const m = record.method||'';
                                        let w = [];
                                        if(['위탁 (남에게 맡김)','위탁+자가 (함께 작업)'].includes(m) && (record.outsource_male||record.outsource_female))
                                            w.push('위탁: 남'+( record.outsource_male||0)+'명 여'+(record.outsource_female||0)+'명');
                                        if(['자가 작업 (직접 함)','위탁+자가 (함께 작업)'].includes(m) && (record.self_male||record.self_female))
                                            w.push('자가: 남'+(record.self_male||0)+'명 여'+(record.self_female||0)+'명');
                                        return w.length ? '<p>👷 인원: '+w.join(' / ')+'</p>' : '';
                                    })()}` : ''}
                                    ${fmtAmt(record.material_cost) ? `<p>💰 자재비: ${fmtAmt(record.material_cost)}</p>` : ''}
                                    ${record.labor_cost ? `<p>👷 인건비: ${fmtAmt(record.labor_cost).replace('원','')}원</p>` : ''}
                                    ${record.memo ? `<p>📝 ${record.memo}</p>` : ''}
                                </div>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="editRecord(${record.id})" class="px-3 py-1 bg-blue-500 text-white text-sm rounded hover:bg-blue-600">수정</button>
                                <button onclick="deleteRecord(${record.id})" class="px-3 py-1 bg-red-500 text-white text-sm rounded hover:bg-red-600">삭제</button>
                            </div>
                        </div>
                    </div>
                `).join('')
                : '<div class="text-center py-12 bg-gray-50 rounded-lg border-2 border-dashed border-gray-300"><p class="text-gray-500 mb-4">📝 아직 기록된 작업이 없습니다</p><p class="text-sm text-gray-400">작업을 진행하실 때마다 기록해주세요</p></div>';

            app.innerHTML = `
                <div class="min-h-screen p-4">
                    <div class="max-w-3xl mx-auto">
                        <div class="bg-white rounded-lg shadow-lg p-4 md:p-6 mb-4">
                            <div class="flex justify-between items-center">
                                <div>
                                    <h1 class="text-lg md:text-2xl font-bold text-gray-800">마늘 생산비 조사</h1>
                                    <p class="text-sm text-emerald-600">6단계: 생육관리</p>
                                </div>
                                <div class="flex gap-2">
                                    <a href="index.html" class="px-3 py-2 bg-gray-200 text-gray-700 rounded-lg text-sm hover:bg-gray-300">메인</a>
                                </div>
                            </div>
                        </div>

                        <div class="bg-white rounded-lg shadow-lg p-6 mb-4">
                            <div class="flex justify-between items-center mb-4">
                                <h2 class="text-xl font-bold text-gray-800">📝 작업 기록</h2>
                                <button onclick="showAddForm()" class="px-4 py-2 bg-emerald-600 text-white rounded-lg font-medium hover:bg-emerald-700">
                                    + 새 작업 기록하기
                                </button>
                            </div>

                            ${isAlreadySubmitted ? '<div class="bg-emerald-50 border-l-4 border-emerald-400 p-4 rounded mb-4"><p class="text-sm text-gray-700">✅ <strong>이미 제출된 단계입니다</strong><br>추가 작업을 기록하고 "다시 제출하기"를 눌러주세요.</p></div>' : ''}

                            <div class="space-y-3">
                                ${recordsHTML}
                            </div>
                        </div>

                        ${surveyState.records.length > 0 ? `
                        <div class="bg-white rounded-lg shadow-lg p-6 mb-4">
                            <h3 class="font-bold text-gray-800 mb-3">💰 비용 합계</h3>
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-center">
                                <div class="bg-blue-50 p-4 rounded-lg">
                                    <p class="text-sm text-gray-600 mb-1">작업 횟수</p>
                                    <p class="text-2xl font-bold text-blue-600">${summary.total_records}회</p>
                                </div>
                                <div class="bg-green-50 p-4 rounded-lg">
                                    <p class="text-sm text-gray-600 mb-1">자재비</p>
                                    <p class="text-lg font-bold text-green-600">${summary.total_material_cost.toLocaleString()}원</p>
                                </div>
                                <div class="bg-purple-50 p-4 rounded-lg">
                                    <p class="text-sm text-gray-600 mb-1">인건비</p>
                                    <p class="text-lg font-bold text-purple-600">${summary.total_labor_cost.toLocaleString()}원</p>
                                </div>
                                <div class="bg-emerald-50 p-4 rounded-lg">
                                    <p class="text-sm text-gray-600 mb-1">총 비용</p>
                                    <p class="text-lg font-bold text-emerald-600">${summary.total_cost.toLocaleString()}원</p>
                                </div>
                            </div>
                        </div>
                        ` : ''}

                        <div class="bg-white rounded-lg shadow-lg p-6">
                            ${surveyState.records.length === 0 ? 
                                '<div class="bg-yellow-50 border-l-4 border-yellow-400 p-4 rounded mb-4"><p class="text-sm text-gray-700">⚠️ 최소 1개 이상의 작업을 기록해야 제출할 수 있습니다.</p></div>' 
                                : ''}
                            <button id="submitStageBtn"
                                id="submitStageBtn" onclick="submitStage()" 
                                class="w-full px-6 py-3 ${surveyState.records.length === 0 ? 'bg-gray-300 cursor-not-allowed' : isAlreadySubmitted ? 'bg-emerald-600 hover:bg-emerald-700' : 'bg-emerald-600 hover:bg-emerald-700'} text-white rounded-lg font-medium text-lg"
                                ${surveyState.records.length === 0 ? 'disabled' : ''}
                            >
                                ${isAlreadySubmitted ? '다시 제출하기' : '제출하기'}
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderForm(app) {
            const editingRecord = surveyState.editingId !== null 
                ? surveyState.records.find(r => r.id === surveyState.editingId)
                : null;

            const today = new Date().toISOString().split('T')[0];

            app.innerHTML = `
                <div class="min-h-screen p-4">
                    <div class="max-w-2xl mx-auto">
                        <div class="bg-white rounded-lg shadow-lg p-6">
                            <h2 class="text-2xl font-bold text-gray-800 mb-6">
                                ${editingRecord ? '✏️ 작업 기록 수정' : '➕ 새 작업 기록'}
                            </h2>

                            <form id="recordForm" class="space-y-6">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">
                                        📅 작업 날짜 <span class="text-red-500">*</span>
                                    </label>
                                    <input 
                                        type="date" 
                                        id="date"
                                        value="${editingRecord ? toInputDate(editingRecord.date) : today}"
                                        max="${today}"
                                        required
                                        class="w-full p-3 border-2 border-gray-300 rounded-lg focus:border-emerald-500 focus:outline-none"
                                    />
                                </div>

                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">
                                        📌 작업 종류 <span class="text-red-500">*</span>
                                    </label>
                                    <div class="space-y-2">
                                        ${['웃거름(추비)', '복토', '김매기', '농약살포(살균제/살충제/제초제)', '영양제', '관수(물주기)'].map(type => `
                                            <label class="flex items-center space-x-3 p-3 border-2 rounded-lg cursor-pointer hover:bg-emerald-50 transition-colors ${editingRecord && editingRecord.type === type ? 'border-emerald-500 bg-emerald-50' : 'border-gray-300'}">
                                                <input 
                                                    type="radio" 
                                                    name="type" 
                                                    value="${type}"
                                                    ${editingRecord && editingRecord.type === type ? 'checked' : ''}
                                                    onchange="updateMethodOptions(this.value)"
                                                    required
                                                    class="w-5 h-5"
                                                />
                                                <span class="text-base">${type}</span>
                                            </label>
                                        `).join('')}
                                    </div>
                                </div>

                                <div id="methodContainer" style="display: none;">
                                    <label class="block text-sm font-medium text-gray-700 mb-2">
                                        🔧 작업 방법 <span class="text-red-500">*</span>
                                    </label>
                                    <select 
                                        id="method"
                                        onchange="updateWorkerFields(this.value)"
                                        class="w-full p-3 border-2 border-gray-300 rounded-lg focus:border-emerald-500 focus:outline-none"
                                    >
                                        <option value=""></option>
                                    </select>
                                </div>

                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">
                                        💰 자재비  (선택)
                                    </label>
                                    <div class="flex items-center space-x-3">
                                        <input 
                                            type="text" inputmode="numeric" 
                                            id="material_cost"
                                            value="${editingRecord ? (parseInt(editingRecord.material_cost)||0).toLocaleString('ko-KR') : ''}"
                                            min="0"
                                            placeholder="0"
                                            class="flex-1 p-3 border-2 border-gray-300 rounded-lg focus:border-emerald-500 focus:outline-none"
                                        oninput="this.value=fmtMoney(this.value)"
                                    />
                                        <span class="text-lg font-medium text-gray-600">원</span>
                                    </div>
                                </div>

                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">
                                        👷 인건비 (선택)
                                    </label>
                                    <div class="flex items-center space-x-3">
                                        <input 
                                            type="text" inputmode="numeric" 
                                            id="labor_cost"
                                            value="${editingRecord ? (editingRecord.labor_cost || '') : ''}"
                                            min="0"
                                            placeholder="0"
                                            class="flex-1 p-3 border-2 border-gray-300 rounded-lg focus:border-emerald-500 focus:outline-none"
                                        oninput="this.value=fmtMoney(this.value)"
                                    />
                                        <span class="text-lg font-medium text-gray-600">원</span>
                                    </div>
                                <div id="workerSection" style="display:none" class="bg-blue-50 p-4 rounded-lg border border-blue-200">
                                    <p class="text-sm font-bold text-gray-700 mb-3">👷 작업 인원</p>
                                    <div id="outsourceWorkers" style="display:none" class="mb-4">
                                        <p class="text-sm font-medium text-gray-600 mb-2">위탁 인원</p>
                                        <div class="flex gap-6">
                                            <label class="flex items-center gap-2 text-sm text-gray-700">남
                                                <input type="number" id="outsource_male" min="0" placeholder="0"
                                                    value="${editingRecord ? (editingRecord.outsource_male||'') : ''}"
                                                    class="w-16 px-2 py-1 border-2 border-gray-300 rounded text-center">명
                                            </label>
                                            <label class="flex items-center gap-2 text-sm text-gray-700">여
                                                <input type="number" id="outsource_female" min="0" placeholder="0"
                                                    value="${editingRecord ? (editingRecord.outsource_female||'') : ''}"
                                                    class="w-16 px-2 py-1 border-2 border-gray-300 rounded text-center">명
                                            </label>
                                        </div>
                                    </div>
                                    <div id="selfWorkers" style="display:none">
                                        <p class="text-sm font-medium text-gray-600 mb-2">자가 인원</p>
                                        <div class="flex gap-6">
                                            <label class="flex items-center gap-2 text-sm text-gray-700">남
                                                <input type="number" id="self_male" min="0" placeholder="0"
                                                    value="${editingRecord ? (editingRecord.self_male||'') : ''}"
                                                    class="w-16 px-2 py-1 border-2 border-gray-300 rounded text-center">명
                                            </label>
                                            <label class="flex items-center gap-2 text-sm text-gray-700">여
                                                <input type="number" id="self_female" min="0" placeholder="0"
                                                    value="${editingRecord ? (editingRecord.self_female||'') : ''}"
                                                    class="w-16 px-2 py-1 border-2 border-gray-300 rounded text-center">명
                                            </label>
                                        </div>
                                    </div>
                                </div>

                                </div>

                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">
                                        📝 메모 (선택)
                                    </label>
                                    <textarea 
                                        id="memo"
                                        rows="3"
                                        placeholder="약재명, 자재명, 사용량 등을 기록하세요&#10;예: 요소비료 1포(20kg), 살충제(델타린) 500ml, 제초제(글라신) 1L"
                                        class="w-full p-3 border-2 border-gray-300 rounded-lg focus:border-emerald-500 focus:outline-none"
                                    >${editingRecord ? (editingRecord.memo || '') : ''}</textarea>
                                </div>

                                <div class="flex gap-4">
                                    <button 
                                        type="button"
                                        onclick="cancelForm()"
                                        class="flex-1 px-6 py-3 bg-gray-200 text-gray-700 rounded-lg font-medium hover:bg-gray-300"
                                    >
                                        취소
                                    </button>
                                    <button 
                                        type="button" onclick="handleFormSubmit()"
                                        class="flex-1 px-6 py-3 bg-emerald-600 text-white rounded-lg font-medium hover:bg-emerald-700"
                                    >
                                        ${editingRecord ? '수정 완료' : '저장'}
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            `;


                    // ★ 수정 모드: 인원 필드 초기화
                    if (editingRecord && editingRecord.method) {
                        setTimeout(() => updateWorkerFields(editingRecord.method), 60);
                    }

            // 수정 모드일 때 필드 초기화
            if (editingRecord && editingRecord.type) {
                setTimeout(() => {
                    updateMethodOptions(editingRecord.type);
                    
                    // 작업 방법 설정
                    if (editingRecord.method) {
                        const methodSelect = document.getElementById('method');
                        if (methodSelect) methodSelect.value = editingRecord.method;
                    }
                    updateWorkerFields(editingRecord.method||'');
                }, 50);
            }
        }

        function handleFormSubmit() {
            
            const workType = document.querySelector('input[name="type"]:checked').value;
            
            const formData = {
                date: document.getElementById('date').value,
                type: workType,
                material_cost: String(parseMoney(document.getElementById('material_cost').value)),
                labor_cost: String(parseMoney(document.getElementById('labor_cost').value)),
                memo: document.getElementById('memo').value
            };

            // 작업 방법이 있는 경우
            if (methodOptions[workType] && methodOptions[workType].length > 0) {
                const method = document.getElementById('method');
                if (method && method.value) {
                    formData.method = method.value;
                }
            }


            const workerData = {
                outsource_male:   document.getElementById('outsource_male')?.value   || '',
                outsource_female: document.getElementById('outsource_female')?.value || '',
                self_male:        document.getElementById('self_male')?.value        || '',
                self_female:      document.getElementById('self_female')?.value      || '',
            };
            Object.assign(formData, workerData);
            addOrUpdateRecord(formData);
        }

        // 초기 렌더링
        // ★ 서버 동기화 (기기 간 이어쓰기)
        // replaced
async function syncFromServer_old_disabled(phone) {
            try {
                const resp = await fetch(`${SCRIPT_URL}?action=load&phone=${encodeURIComponent(phone)}`);
                if (!resp.ok) throw new Error();
                const result = await resp.json();
                if (result.success && result.data && Object.keys(result.data).length > 0) {
                    const key = `garlic_survey_${phone}`;
                    const local = JSON.parse(localStorage.getItem(key)||'{}');
                    localStorage.setItem(key, JSON.stringify(Object.assign({}, local, result.data)));
                }
            } catch(e) { /* 로컬 데이터 사용 */ }
        }

        // ★ POST 방식 서버 동기화 (CORS 문제 없음)
        async function syncFromServer(phone) {
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'cors',
                    headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
                    body: JSON.stringify({ action: 'load', phoneNumber: phone })
                });
                const result = await response.json();
                if (result && result.success && result.data && Object.keys(result.data).length > 1) {
                    const key = `garlic_survey_${phone}`;
                    const local = JSON.parse(localStorage.getItem(key)||'{}');
                    const flat = flattenData(result.data);
                    const merged = Object.assign({}, flattenData(local), flat);
                    localStorage.setItem(key, JSON.stringify(merged));
                    console.log('✅ 서버 동기화 완료');
                }
            } catch(e) {
                console.log('서버 동기화 실패:', e.message);
            }
        }


        // ★ 비동기 초기화
        async function init() {
            const phone = localStorage.getItem('garlic_survey_phone');
            if (!phone) { window.location.href = 'index.html'; return; }
            surveyState.phoneNumber = phone;
            await syncFromServer(phone);
            loadData();  // ★ 서버 동기화 후 데이터 로드
            surveyState.view = 'intro';
            render();
        }
        init();
    </script>
</body>
</html>
