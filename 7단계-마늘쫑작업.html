<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마늘 생산비 조사 - 7단계: 마늘쫑 작업</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-pink-50 to-pink-100 min-h-screen">
    <div id="app"></div>
    <script>
        const surveyState = {
            view: 'list',
            formData: {},
            phoneNumber: '',
            stage: 7,
            records: [],
            editingId: null
        };


        // ★ 서버 동기화 함수 (기기 간 이어쓰기)
        // replaced
async function syncFromServer_old_disabled(phone) {
            try {
                const resp = await fetch(`${SCRIPT_URL}?action=load&phone=${encodeURIComponent(phone)}`);
                if (!resp.ok) throw new Error();
                const result = await resp.json();
                if (result.success && result.data && Object.keys(result.data).length > 0) {
                    const key = `garlic_survey_${phone}`;
                    const local = JSON.parse(localStorage.getItem(key)||'{}');
                    localStorage.setItem(key, JSON.stringify(Object.assign({}, local, result.data)));
                }
            } catch(e) { /* 로컬 데이터 사용 */ }
        }


        // ★ 인원 입력 필드 표시/숨김
        function updateWorkerFields(method) {
            const section = document.getElementById('workerSection');
            const outDiv  = document.getElementById('outsourceWorkers');
            const selfDiv = document.getElementById('selfWorkers');
            if (!section) return;
            const showOut  = ['위탁 (남에게 맡김)', '위탁+자가'].includes(method);
            const showSelf = ['자가 작업 (직접 함)', '위탁+자가'].includes(method);
            outDiv.style.display  = showOut  ? 'block' : 'none';
            selfDiv.style.display = showSelf ? 'block' : 'none';
            section.style.display = (showOut || showSelf) ? 'block' : 'none';
        }

        // ★ 천단위 콤마 유틸리티
        function fmtMoney(v) {
            const n = parseInt(String(v||'').replace(/[^0-9]/g,''))||0;
            return n === 0 ? '' : n.toLocaleString('ko-KR');
        }
        function parseMoney(v) {
            return parseInt(String(v||'').replace(/[^0-9]/g,''))||0;
        }

        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwNoDIt4MVKwk3ZlAVQCI2DG5MqoeVPklOC-qgzwPvV4qBlTBYlL2FDYgnXTpxj-jdd/exec';

        function updateFormFields(workType) {
            const methodContainer = document.getElementById('methodContainer');
            const salesContainer = document.getElementById('salesFieldsContainer');
            
            if (workType === '마늘쫑 뽑기' || workType === '주아제거' || workType === '줄기절단') {
                methodContainer.style.display = 'block';
                salesContainer.style.display = 'none';
                // 판매 필드 초기화
                const unitPrice = document.getElementById('unit_price');
                const salesAmount = document.getElementById('sales_amount');
                if (unitPrice) unitPrice.value = '';
                if (salesAmount) salesAmount.value = '';
            } else if (workType === '마늘쫑 판매') {
                methodContainer.style.display = 'none';
                salesContainer.style.display = 'block';
                // 방법 필드 초기화
                const method = document.getElementById('method');
                if (method) method.value = '';
            }
        }

        function saveData() {
            if (surveyState.phoneNumber) {
                const dataToSave = {
                    stage_7_records: surveyState.records,
                    stage_7_summary: calculateSummary(),
                    completed_stage_7: surveyState.formData.completed_stage_7 || false,
                    savedAt: new Date().toISOString(),
                    stage: surveyState.stage,
                    phoneNumber: surveyState.phoneNumber
                };
                
                const allData = localStorage.getItem(`garlic_survey_${surveyState.phoneNumber}`);
                const parsed = allData ? JSON.parse(allData) : {};
                Object.assign(parsed, dataToSave);
                
                localStorage.setItem(`garlic_survey_${surveyState.phoneNumber}`, JSON.stringify(parsed));
            }
        }

        function loadData() {
            if (surveyState.phoneNumber) {
                const savedData = localStorage.getItem(`garlic_survey_${surveyState.phoneNumber}`);
                if (savedData) {
                    const parsed = JSON.parse(savedData);
                    surveyState.records = parsed.stage_7_records || [];
                    surveyState.formData = parsed;
                    return true;
                }
            }
            return false;
        }

        function calculateSummary() {
            const totalRecords = surveyState.records.length;
            const totalMaterialCost = surveyState.records.reduce((sum, r) => sum + (parseInt(r.material_cost) || 0), 0);
            const totalLaborCost = surveyState.records.reduce((sum, r) => sum + (parseInt(r.labor_cost) || 0), 0);
            
            return {
                total_records: totalRecords,
                total_material_cost: totalMaterialCost,
                total_labor_cost: totalLaborCost,
                total_cost: totalMaterialCost + totalLaborCost
            };
        }

        function addOrUpdateRecord(recordData) {
            if (surveyState.editingId !== null) {
                const index = surveyState.records.findIndex(r => r.id === surveyState.editingId);
                if (index !== -1) {
                    surveyState.records[index] = { ...recordData, id: surveyState.editingId };
                }
                surveyState.editingId = null;
            } else {
                const newId = surveyState.records.length > 0 
                    ? Math.max(...surveyState.records.map(r => r.id)) + 1 
                    : 1;
                surveyState.records.push({ ...recordData, id: newId });
            }
            saveData();
            surveyState.view = 'list';
            render();
        }

        function editRecord(id) {
            surveyState.editingId = id;
            surveyState.view = 'form';
            render();
        }

        function deleteRecord(id) {
            if (confirm('이 작업 기록을 삭제하시겠습니까?')) {
                surveyState.records = surveyState.records.filter(r => r.id !== id);
                saveData();
                render();
            }
        }

        function showAddForm() {
            surveyState.editingId = null;
            surveyState.view = 'form';
            render();
        }

        function cancelForm() {
            surveyState.editingId = null;
            surveyState.view = 'list';
            render();
        }

        let _isSubmitting = false;
        async function submitStage() {
            if (_isSubmitting) return;
            if (surveyState.records.length === 0) {
                alert('⚠️ 최소 1개 이상의 작업을 기록해야 제출할 수 있습니다.');
                return;
            }

            const summary = calculateSummary();
            
            const submitData = {
                timestamp: new Date().toISOString(),
                phoneNumber: surveyState.phoneNumber,
                stage: 7,
                stage_7_records: surveyState.records,
                stage_7_summary: summary,
                completed_stage_7: true
            };

            _isSubmitting = true;
            // ★ 즉시 버튼 피드백
            const submitBtn = document.getElementById('submitStageBtn');
            if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = '⏳ 저장 중...'; }
            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(submitData)
                });

                surveyState.formData.completed_stage_7 = true;
                saveData();

                alert('✅ 7단계가 제출되었습니다!\n\n메인 화면으로 돌아가 다음 단계를 진행하세요.');
                _isSubmitting = false; window.location.href = 'index.html';
            } catch (error) {
                console.error('제출 오류:', error);
                alert('✅ 7단계가 저장되었습니다!\n\n메인 화면으로 돌아가 다음 단계를 진행하세요.');
                _isSubmitting = false; window.location.href = 'index.html';
            }
        }

        function handleFormSubmit() {
            
            const workType = document.querySelector('input[name="work_type"]:checked')?.value;
            
            if (!workType) {
                alert('작업 종류를 선택해주세요.');
                return;
            }

            const formData = {
                date: document.getElementById('date').value,
                work_type: workType,
                material_cost: String(parseMoney(document.getElementById('material_cost').value)),
                labor_cost: String(parseMoney(document.getElementById('labor_cost').value)),
                memo: document.getElementById('memo').value
            };

            if (workType === '마늘쫑 뽑기') {
                formData.method = document.getElementById('method').value;
                if (!formData.method) {
                    alert('작업 방법을 선택해주세요.');
                    return;
                }
            } else if (workType === '마늘쫑 판매') {
                formData.unit_price = String(parseMoney(document.getElementById('unit_price').value));
                formData.sales_amount = String(parseMoney(document.getElementById('sales_amount').value));
                
                if (!formData.unit_price || !formData.sales_amount) {
                    alert('판매단가와 판매량을 모두 입력해주세요.');
                    return;
                }
                
                // 판매 수익 계산
                formData.sales_revenue = parseInt(formData.unit_price) * parseFloat(formData.sales_amount);
            }


            const workerData = {
                outsource_male:   document.getElementById('outsource_male')?.value   || '',
                outsource_female: document.getElementById('outsource_female')?.value || '',
                self_male:        document.getElementById('self_male')?.value        || '',
                self_female:      document.getElementById('self_female')?.value      || '',
            };
            Object.assign(formData, workerData);
            addOrUpdateRecord(formData);
        }

        function render() {
            const app = document.getElementById('app');
            const savedPhone = localStorage.getItem('garlic_survey_phone');
            
            if (!savedPhone) {
                app.innerHTML = `
                    <div class="min-h-screen flex items-center justify-center p-4">
                        <div class="max-w-md w-full bg-white rounded-lg shadow-lg p-8 text-center">
                            <div class="bg-pink-100 rounded-full w-20 h-20 flex items-center justify-center mx-auto mb-4">
                                <span class="text-4xl">⚠️</span>
                            </div>
                            <h2 class="text-2xl font-bold text-gray-800 mb-4">로그인이 필요합니다</h2>
                            <p class="text-gray-600 mb-6">먼저 메인 화면에서 전화번호로 로그인해주세요.</p>
                            <a href="index.html" class="inline-block px-6 py-3 bg-pink-600 text-white rounded-lg font-medium hover:bg-pink-700">메인 화면으로 이동</a>
                        </div>
                    </div>
                `;
                return;
            }

            if (!surveyState.phoneNumber) {
                surveyState.phoneNumber = savedPhone;
                loadData();
            }

            if (surveyState.view === 'intro') {
                renderIntro(app);
            } else if (surveyState.view === 'list') {
                renderList(app);
            } else if (surveyState.view === 'form') {
                renderForm(app);
            }
        }

        function renderIntro(app) {
            app.innerHTML = `
                <div class="min-h-screen flex items-center justify-center p-4">
                    <div class="max-w-2xl w-full bg-white rounded-lg shadow-lg p-8 text-center space-y-6 fade-in">
                        <div class="bg-pink-100 rounded-full w-20 h-20 flex items-center justify-center mx-auto">
                            <span class="text-4xl">🌸</span>
                        </div>
                        <h1 class="text-3xl font-bold text-gray-800">마늘 생산비 조사</h1>
                        <p class="text-xl text-pink-600 font-medium">7단계: 마늘쫑 뽑기</p>
                        <p class="text-gray-600">마늘쫑 작업 및 판매 작업을 작업일지 방식으로 기록합니다.</p>
                        
                        <div class="bg-blue-50 p-6 rounded-lg text-left">
                            <h3 class="font-bold text-gray-800 mb-3">📝 작업 방식 안내</h3>
                            <ul class="text-sm text-gray-700 space-y-2">
                                <li>✅ 각 작업마다 기록 추가</li>
                                <li>✅ 날짜, 작업종류, 비용 입력</li>
                                <li>✅ 언제든지 추가/수정/삭제 가능</li>
                                <li>✅ 최소 1개 이상 기록 후 제출</li>
                            </ul>
                        </div>
                        <div class="flex gap-4 justify-center">
                            <a href="index.html" class="px-6 py-3 bg-gray-200 text-gray-700 rounded-lg font-medium hover:bg-gray-300">← 메인으로</a>
                            <button onclick="surveyState.view = 'list'; render();" class="px-8 py-3 bg-pink-600 text-white rounded-lg font-medium hover:bg-pink-700 text-lg">시작하기 →</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderList(app) {
            const summary = calculateSummary();
            const isAlreadySubmitted = surveyState.formData.completed_stage_7;
            
            const recordsHTML = surveyState.records.length > 0 
                ? surveyState.records.map(record => `
                    <div class="bg-gray-50 p-4 rounded-lg border-2 border-gray-200">
                        <div class="flex justify-between items-start mb-2">
                            <div class="flex-1">
                                <div class="flex items-center gap-2 mb-1">
                                    <span class="text-lg font-bold text-pink-600">${record.work_type}</span>
                                    <span class="text-sm text-gray-500">${record.date}</span>
                                </div>
                                <div class="text-sm text-gray-700 space-y-1">
                                    ${record.method ? `<p>🔧 작업방법: ${record.method}</p>
                                    ${(()=>{
                                        const m = record.method||'';
                                        let w = [];
                                        if(['위탁 (남에게 맡김)','위탁+자가'].includes(m) && (record.outsource_male||record.outsource_female))
                                            w.push('위탁: 남'+( record.outsource_male||0)+'명 여'+(record.outsource_female||0)+'명');
                                        if(['자가 작업 (직접 함)','위탁+자가'].includes(m) && (record.self_male||record.self_female))
                                            w.push('자가: 남'+(record.self_male||0)+'명 여'+(record.self_female||0)+'명');
                                        return w.length ? '<p>👷 인원: '+w.join(' / ')+'</p>' : '';
                                    })()}` : ''}
                                    ${record.unit_price ? `<p>💵 판매단가: ${parseInt(record.unit_price).toLocaleString()}원/kg</p>` : ''}
                                    ${record.sales_amount ? `<p>⚖️ 판매량: ${parseFloat(record.sales_amount)}kg</p>` : ''}
                                    ${record.sales_revenue ? `<p>💰 판매수익: ${parseInt(record.sales_revenue).toLocaleString()}원</p>` : ''}
                                    <p>💰 자재비: ${parseInt(record.material_cost).toLocaleString()}원</p>
                                    ${record.labor_cost && parseInt(record.labor_cost) > 0 ? `<p>👷 인건비: ${parseInt(record.labor_cost).toLocaleString()}원</p>` : ''}
                                    ${record.memo ? `<p>📝 ${record.memo}</p>` : ''}
                                </div>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="editRecord(${record.id})" class="px-3 py-1 bg-blue-500 text-white text-sm rounded hover:bg-blue-600">수정</button>
                                <button onclick="deleteRecord(${record.id})" class="px-3 py-1 bg-red-500 text-white text-sm rounded hover:bg-red-600">삭제</button>
                            </div>
                        </div>
                    </div>
                `).join('')
                : '<div class="text-center py-12 bg-gray-50 rounded-lg border-2 border-dashed border-gray-300"><p class="text-gray-500 mb-4">📝 아직 기록된 작업이 없습니다</p><p class="text-sm text-gray-400">작업을 진행하실 때마다 기록해주세요</p></div>';

            app.innerHTML = `
                <div class="min-h-screen p-4">
                    <div class="max-w-3xl mx-auto">
                        <div class="bg-white rounded-lg shadow-lg p-4 md:p-6 mb-4">
                            <div class="flex justify-between items-center">
                                <div>
                                    <h1 class="text-lg md:text-2xl font-bold text-gray-800">마늘 생산비 조사</h1>
                                    <p class="text-sm text-pink-600">7단계: 마늘쫑 작업</p>
                                </div>
                                <div class="flex gap-2">
                                    <a href="index.html" class="px-3 py-2 bg-gray-200 text-gray-700 rounded-lg text-sm hover:bg-gray-300">메인</a>
                                </div>
                            </div>
                        </div>

                        <div class="bg-white rounded-lg shadow-lg p-6 mb-4">
                            <div class="flex justify-between items-center mb-4">
                                <h2 class="text-xl font-bold text-gray-800">📝 작업 기록</h2>
                                <button onclick="showAddForm()" class="px-4 py-2 bg-pink-600 text-white rounded-lg font-medium hover:bg-pink-700">
                                    + 새 작업 기록하기
                                </button>
                            </div>

                            ${isAlreadySubmitted ? '<div class="bg-pink-50 border-l-4 border-pink-400 p-4 rounded mb-4"><p class="text-sm text-gray-700">✅ <strong>이미 제출된 단계입니다</strong><br>추가 작업을 기록하고 "다시 제출하기"를 눌러주세요.</p></div>' : ''}

                            <div class="space-y-3">
                                ${recordsHTML}
                            </div>
                        </div>

                        ${surveyState.records.length > 0 ? `
                        <div class="bg-white rounded-lg shadow-lg p-6 mb-4">
                            <h3 class="font-bold text-gray-800 mb-3">💰 비용 합계</h3>
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-center">
                                <div class="bg-blue-50 p-4 rounded-lg">
                                    <p class="text-sm text-gray-600 mb-1">작업 횟수</p>
                                    <p class="text-2xl font-bold text-blue-600">${summary.total_records}회</p>
                                </div>
                                <div class="bg-green-50 p-4 rounded-lg">
                                    <p class="text-sm text-gray-600 mb-1">자재비</p>
                                    <p class="text-lg font-bold text-green-600">${summary.total_material_cost.toLocaleString()}원</p>
                                </div>
                                <div class="bg-purple-50 p-4 rounded-lg">
                                    <p class="text-sm text-gray-600 mb-1">인건비</p>
                                    <p class="text-lg font-bold text-purple-600">${summary.total_labor_cost.toLocaleString()}원</p>
                                </div>
                                <div class="bg-pink-50 p-4 rounded-lg">
                                    <p class="text-sm text-gray-600 mb-1">총 비용</p>
                                    <p class="text-lg font-bold text-pink-600">${summary.total_cost.toLocaleString()}원</p>
                                </div>
                            </div>
                        </div>
                        ` : ''}

                        <div class="bg-white rounded-lg shadow-lg p-6">
                            ${surveyState.records.length === 0 ? 
                                '<div class="bg-yellow-50 border-l-4 border-yellow-400 p-4 rounded mb-4"><p class="text-sm text-gray-700">⚠️ 최소 1개 이상의 작업을 기록해야 제출할 수 있습니다.</p></div>' 
                                : ''}
                            <button id="submitStageBtn"
                                id="submitStageBtn" onclick="submitStage()" 
                                class="w-full px-6 py-3 ${surveyState.records.length === 0 ? 'bg-gray-300 cursor-not-allowed' : isAlreadySubmitted ? 'bg-pink-600 hover:bg-pink-700' : 'bg-pink-600 hover:bg-pink-700'} text-white rounded-lg font-medium text-lg"
                                ${surveyState.records.length === 0 ? 'disabled' : ''}
                            >
                                ${isAlreadySubmitted ? '다시 제출하기' : '제출하기'}
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderForm(app) {
            const editingRecord = surveyState.editingId !== null 
                ? surveyState.records.find(r => r.id === surveyState.editingId)
                : null;

            const today = new Date().toISOString().split('T')[0];

            const workTypes = ['마늘쫑 뽑기', '마늘쫑 판매', '주아제거', '줄기절단'];

            app.innerHTML = `
                <div class="min-h-screen p-4">
                    <div class="max-w-2xl mx-auto">
                        <div class="bg-white rounded-lg shadow-lg p-6">
                            <h2 class="text-2xl font-bold text-gray-800 mb-6">
                                ${editingRecord ? '✏️ 작업 기록 수정' : '➕ 새 작업 기록'}
                            </h2>

                            <form id="recordForm" class="space-y-6">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">
                                        📅 작업 날짜 <span class="text-red-500">*</span>
                                    </label>
                                    <input 
                                        type="date" 
                                        id="date"
                                        value="${editingRecord ? editingRecord.date : today}"
                                        max="${today}"
                                        required
                                        class="w-full p-3 border-2 border-gray-300 rounded-lg focus:border-pink-500 focus:outline-none"
                                    />
                                </div>

                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">
                                        📌 작업 종류 <span class="text-red-500">*</span>
                                    </label>
                                    <div class="space-y-2">
                                        ${workTypes.map(type => `
                                            <label class="flex items-center space-x-3 p-3 border-2 rounded-lg cursor-pointer hover:bg-pink-50 transition-colors ${editingRecord && editingRecord.work_type === type ? 'border-pink-500 bg-pink-50' : 'border-gray-300'}">
                                                <input 
                                                    type="radio" 
                                                    name="work_type" 
                                                    value="${type}"
                                                    ${editingRecord && editingRecord.work_type === type ? 'checked' : ''}
                                                    onchange="updateFormFields(this.value)"
                                                    class="w-5 h-5 text-pink-600 focus:ring-pink-500"
                                                />
                                                <span class="text-gray-800 font-medium">${type}</span>
                                            </label>
                                        `).join('')}
                                    </div>
                                </div>

                                <div id="methodContainer" style="display: none;">
                                    <label class="block text-sm font-medium text-gray-700 mb-2">
                                        🔧 작업 방법 <span class="text-red-500">*</span>
                                    </label>
                                    <select 
                                        id="method"
                                        class="w-full p-3 border-2 border-gray-300 rounded-lg focus:border-pink-500 focus:outline-none"
                                    >
                                        <option value="">선택하세요</option>
                                        <option value="위탁 (남에게 맡김)">위탁 (남에게 맡김)</option>
                                        <option value="자가 작업 (직접 함)">자가 작업 (직접 함)</option>
                                        <option value="위탁+자가">위탁+자가</option>
                                    </select>
                                </div>

                                <div id="salesFieldsContainer" style="display: none;">
                                    <div class="space-y-4">
                                        <div>
                                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                                💵 판매단가 (1kg당 원) <span class="text-red-500">*</span>
                                            </label>
                                            <input 
                                                type="text" inputmode="numeric" 
                                                id="unit_price"
                                                min="0"
                                                placeholder="kg당 판매 가격"
                                                class="w-full p-3 border-2 border-gray-300 rounded-lg focus:border-pink-500 focus:outline-none"
                                        oninput="this.value=fmtMoney(this.value)"
                                    />
                                            <p class="text-xs text-gray-500 mt-1">마늘쫑 1kg당 판매 가격</p>
                                        </div>

                                        <div>
                                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                                ⚖️ 판매량 (kg) <span class="text-red-500">*</span>
                                            </label>
                                            <input 
                                                type="text" inputmode="numeric" 
                                                id="sales_amount"
                                                min="0"
                                                step="0.1"
                                                placeholder="판매한 마늘쫑 무게"
                                                class="w-full p-3 border-2 border-gray-300 rounded-lg focus:border-pink-500 focus:outline-none"
                                        oninput="this.value=fmtMoney(this.value)"
                                    />
                                            <p class="text-xs text-gray-500 mt-1">판매한 마늘쫑의 총 무게</p>
                                        </div>
                                    </div>
                                </div>

                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">
                                        💰 자재비 (원)
                                    </label>
                                    <input 
                                        type="text" inputmode="numeric" 
                                        id="material_cost"
                                        value="${editingRecord ? (parseInt(editingRecord.material_cost)||0).toLocaleString('ko-KR') : ''}"
                                        min="0"
                                        placeholder="자재 구입 비용"
                                        class="w-full p-3 border-2 border-gray-300 rounded-lg focus:border-pink-500 focus:outline-none"
                                        oninput="this.value=fmtMoney(this.value)"
                                    />
                                    <p class="text-xs text-gray-500 mt-1">자재 구입 비용</p>
                                </div>

                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">
                                        👷 인건비 (원)
                                    </label>
                                    <input 
                                        type="text" inputmode="numeric" 
                                        id="labor_cost"
                                        value="${editingRecord ? (parseInt(editingRecord.labor_cost)||0).toLocaleString('ko-KR') : ''}"
                                        min="0"
                                        placeholder="작업 인건비"
                                        class="w-full p-3 border-2 border-gray-300 rounded-lg focus:border-pink-500 focus:outline-none"
                                        oninput="this.value=fmtMoney(this.value)"
                                    />
                                    <p class="text-xs text-gray-500 mt-1">작업 인건비 (고용 또는 위탁)</p>
                                </div>
                                <div id="workerSection" style="display:none" class="bg-blue-50 p-4 rounded-lg border border-blue-200">
                                    <p class="text-sm font-bold text-gray-700 mb-3">👷 작업 인원</p>
                                    <div id="outsourceWorkers" style="display:none" class="mb-4">
                                        <p class="text-sm font-medium text-gray-600 mb-2">위탁 인원</p>
                                        <div class="flex gap-6">
                                            <label class="flex items-center gap-2 text-sm text-gray-700">남
                                                <input type="number" id="outsource_male" min="0" placeholder="0"
                                                    value="${editingRecord ? (editingRecord.outsource_male||'') : ''}"
                                                    class="w-16 px-2 py-1 border-2 border-gray-300 rounded text-center">명
                                            </label>
                                            <label class="flex items-center gap-2 text-sm text-gray-700">여
                                                <input type="number" id="outsource_female" min="0" placeholder="0"
                                                    value="${editingRecord ? (editingRecord.outsource_female||'') : ''}"
                                                    class="w-16 px-2 py-1 border-2 border-gray-300 rounded text-center">명
                                            </label>
                                        </div>
                                    </div>
                                    <div id="selfWorkers" style="display:none">
                                        <p class="text-sm font-medium text-gray-600 mb-2">자가 인원</p>
                                        <div class="flex gap-6">
                                            <label class="flex items-center gap-2 text-sm text-gray-700">남
                                                <input type="number" id="self_male" min="0" placeholder="0"
                                                    value="${editingRecord ? (editingRecord.self_male||'') : ''}"
                                                    class="w-16 px-2 py-1 border-2 border-gray-300 rounded text-center">명
                                            </label>
                                            <label class="flex items-center gap-2 text-sm text-gray-700">여
                                                <input type="number" id="self_female" min="0" placeholder="0"
                                                    value="${editingRecord ? (editingRecord.self_female||'') : ''}"
                                                    class="w-16 px-2 py-1 border-2 border-gray-300 rounded text-center">명
                                            </label>
                                        </div>
                                    </div>
                                </div>


                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">
                                        📝 메모 (선택사항)
                                    </label>
                                    <textarea 
                                        id="memo"
                                        rows="3"
                                        placeholder="약재명, 자재명, 사용량 등을 기록하세요&#10;예: 마늘쫑 100kg 수확, 판매단가 kg당 5,000원"
                                        class="w-full p-3 border-2 border-gray-300 rounded-lg focus:border-pink-500 focus:outline-none"
                                    >${editingRecord ? editingRecord.memo : ''}</textarea>
                                </div>

                                <div class="flex gap-4">
                                    <button 
                                        type="button"
                                        onclick="cancelForm()"
                                        class="flex-1 px-6 py-3 bg-gray-200 text-gray-700 rounded-lg font-medium hover:bg-gray-300"
                                    >
                                        취소
                                    </button>
                                    <button 
                                        type="button" onclick="handleFormSubmit()"
                                        class="flex-1 px-6 py-3 bg-pink-600 text-white rounded-lg font-medium hover:bg-pink-700"
                                    >
                                        ${editingRecord ? '수정 완료' : '기록 추가'}
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            `;


                    // ★ 수정 모드: 인원 필드 초기화
                    if (editingRecord && editingRecord.method) {
                        setTimeout(() => updateWorkerFields(editingRecord.method), 60);
                    }

            // 수정 모드일 때 필드 초기화
            if (editingRecord) {
                setTimeout(() => {
                    if (editingRecord.work_type === '마늘쫑 뽑기' && editingRecord.method) {
                        updateFormFields('마늘쫑 뽑기');
                        const methodSelect = document.getElementById('method');
                        if (methodSelect) methodSelect.value = editingRecord.method;
                    } else if (editingRecord.work_type === '마늘쫑 판매') {
                        updateFormFields('마늘쫑 판매');
                        if (editingRecord.unit_price) {
                            const unitPrice = document.getElementById('unit_price');
                            if (unitPrice) unitPrice.value = editingRecord.unit_price;
                        }
                        if (editingRecord.sales_amount) {
                            const salesAmount = document.getElementById('sales_amount');
                            if (salesAmount) salesAmount.value = editingRecord.sales_amount;
                        }
                    }
                    updateWorkerFields(editingRecord.method||'');
                }, 50);
            }
        }

        // ★ 서버 동기화 (기기 간 이어쓰기)
        // replaced
async function syncFromServer_old_disabled(phone) {
            try {
                const resp = await fetch(`${SCRIPT_URL}?action=load&phone=${encodeURIComponent(phone)}`);
                if (!resp.ok) throw new Error();
                const result = await resp.json();
                if (result.success && result.data && Object.keys(result.data).length > 0) {
                    const key = `garlic_survey_${phone}`;
                    const local = JSON.parse(localStorage.getItem(key)||'{}');
                    localStorage.setItem(key, JSON.stringify(Object.assign({}, local, result.data)));
                }
            } catch(e) { /* 로컬 데이터 사용 */ }
        }

        // ★ POST 방식 서버 동기화 (CORS 문제 없음)
        async function syncFromServer(phone) {
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'cors',
                    headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
                    body: JSON.stringify({ action: 'load', phoneNumber: phone })
                });
                const result = await response.json();
                if (result && result.success && result.data && Object.keys(result.data).length > 1) {
                    const key = `garlic_survey_${phone}`;
                    const local = JSON.parse(localStorage.getItem(key)||'{}');
                    const flat = flattenData(result.data);
                    const merged = Object.assign({}, flattenData(local), flat);
                    localStorage.setItem(key, JSON.stringify(merged));
                    console.log('✅ 서버 동기화 완료');
                }
            } catch(e) {
                console.log('서버 동기화 실패:', e.message);
            }
        }


        // ★ 비동기 초기화
        async function init() {
            const phone = localStorage.getItem('garlic_survey_phone');
            if (!phone) { window.location.href = 'index.html'; return; }
            surveyState.phoneNumber = phone;
            await syncFromServer(phone);
            loadData();  // ★ 서버 동기화 후 데이터 로드
            surveyState.view = 'intro';
            render();
        }
        init();

    </script>
</body>
